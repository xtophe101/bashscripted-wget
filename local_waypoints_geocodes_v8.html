            text: `${profile.icon} ${profile.label} — punt per ${profile.minMoveM >= 1000
              ? `${(profile.minMoveM / 1000).toFixed(profile.minMoveM % 1000 ? 1 : 0)} km`
              : `${profile.minMoveM} m`}`
          })));
        els.trackMode.replaceChildren(...options.map(option => {
          const element = document.createElement('option');
          element.value = option.value;
          element.textContent = option.text;
          return element;
        }));
      }

      function describeTrackMode(mode) {
        const cfg = CONFIG.tracking;
        if (mode === 'auto') {
          const detected = profileById(activeTrack?.profile);
          return `De drempel volgt de gemeten snelheid` +
            (detected ? `; nu ${detected.icon} ${detected.label} (${detected.minMoveM} m, elke ${Math.round(detected.sampleMs / 1000)} s).` : '.') +
            ` Stilstaan blijft beperkt tot één punt per ${Math.round(cfg.stationaryMaxIntervalMs / 60000)} minuten binnen ${cfg.stationaryRadiusM} m.`;
        }
        const profile = profileById(mode);
        if (!profile) return '';
        return `Vast profiel: een punt zodra er ${profile.minMoveM} m is afgelegd, GPS elke ${Math.round(profile.sampleMs / 1000)} s.`;
      }

      function syncTrackModeHint() {
        els.trackModeHint.textContent = describeTrackMode(els.trackMode.value);
      }

      els.trackMode.addEventListener('change', () => {
        syncTrackModeHint();
        // Meteen toepassen op een lopende opname: het interval verandert mee.
        if (activeTrack?.active && String(activeTrack.id) === els.trackId.value) {
          activeTrack.trackingMode = els.trackMode.value;
          trackingProfile = els.trackMode.value === 'auto'
            ? trackingProfile
            : profileById(els.trackMode.value);
          if (activeTrack.trackingMode !== 'auto') activeTrack.profile = els.trackMode.value;
          saveActiveTrack();
          startTrackingTimer({ restartOnly: true });
          updateActiveTrackRow();
        }
      });

      function openTrackModal(track, justFinalized = false) {
        const stats = trackStats(track);
        els.trackId.value = track.id;
        els.trackTitle.value = track.title || 'Opgenomen track';
        els.trackNote.value = track.note || '';
        fillTrackModeOptions();
        els.trackMode.value = track.trackingMode || CONFIG.tracking.defaultMode;
        if (!els.trackMode.value) els.trackMode.value = 'auto';
        syncTrackModeHint();
        els.trackCategory.value = track.category || '';
        els.trackGroup.value = track.group || lastUsedGroup;
        refreshDatalists();
        els.trackStartAt.value = track.startAt || localDateTimeValue();
        els.trackEndAt.value = track.endAt || localDateTimeValue();
        els.trackDistance.textContent = formatDistance(stats.distance);
        els.trackDuration.textContent = formatDuration(stats.durationMs);
        els.trackPoints.textContent = String(stats.points);
        els.trackModalTitle.textContent = track.active ? 'Lopende track' : (justFinalized ? 'Track afronden' : 'Track bewerken');
        els.trackDeleteBtn.hidden = Boolean(track.active) || !items.some(candidate => String(candidate.id) === String(track.id));
        els.trackWarning.hidden = !stats.gaps;
        els.trackWarning.textContent = stats.gaps
          ? `${stats.gaps} onderbreking${stats.gaps === 1 ? '' : 'en'} gevonden. De kaart toont losse segmenten en verbindt ontbrekende GPS-periodes niet.`
          : '';
        els.trackModal.classList.add('open');
        document.body.classList.add('modal-visible');
        setTimeout(() => { trackFormBaseline = serializeTrackForm(); }, 0);
      }

      function closeTrackModal(force = false) {
        if (force !== true && els.trackModal.classList.contains('open') &&
            serializeTrackForm() !== trackFormBaseline &&
            !confirm('Je hebt niet-opgeslagen wijzigingen. Toch sluiten?')) {
          return false;
        }
        els.trackModal.classList.remove('open');
        syncModalVisibleClass();
        trackFormBaseline = '';
        return true;
      }

      els.trackForm.addEventListener('submit', event => {
        event.preventDefault();
        const track = findItem(els.trackId.value);
        if (!track) return;
        if (new Date(els.trackEndAt.value) < new Date(els.trackStartAt.value)) {
          toast('Einde moet na de start liggen.');
          return;
        }
        track.title = els.trackTitle.value.trim();
        track.note = els.trackNote.value.trim();
        track.category = els.trackCategory.value.trim();
        track.group = els.trackGroup.value.trim();
        track.trackingMode = els.trackMode.value;
        lastUsedGroup = track.group;
        track.startAt = els.trackStartAt.value;
        track.endAt = els.trackEndAt.value;
        track.updatedAt = new Date().toISOString();
        if (track.active) saveActiveTrack(); else void persistItem(track);
        trackFormBaseline = serializeTrackForm();
        closeTrackModal(true);
        render();
        toast('Track bewaard.');
      });

      els.trackCloseBtn.addEventListener('click', () => closeTrackModal());
      els.trackCancelBtn.addEventListener('click', () => closeTrackModal());
      els.trackModal.addEventListener('click', event => {
        if (event.target === els.trackModal) closeTrackModal();
      });

      function checkpointForInterruption(type) {
        if (!activeTrack?.active) return;
        activeTrack.pendingGap = true;
        activeTrack.events = Array.isArray(activeTrack.events) ? activeTrack.events : [];
        activeTrack.events.push({ time: new Date().toISOString(), type });
        activeTrack.updatedAt = new Date().toISOString();
        saveActiveTrack();
      }

      document.addEventListener('visibilitychange', () => {
        if (!activeTrack?.active) return;
        if (document.hidden) checkpointForInterruption('page-hidden');
        else requestTrackPosition();
      });
      window.addEventListener('pagehide', () => checkpointForInterruption('pagehide'));
      window.addEventListener('beforeunload', () => checkpointForInterruption('beforeunload'));

      /* ------------------------------------------------------------------ *
       * Import / export
       * ------------------------------------------------------------------ */
      function normalizeImportedItem(raw, index) {
        if (!raw || typeof raw !== 'object') throw new Error(`Item ${index + 1} is geen object.`);
        const title = String(raw.title || '').trim();
        if (!title) throw new Error(`Item ${index + 1} heeft geen titel.`);

        const startAt = raw.startAt ? String(raw.startAt) : localDateTimeValue();
        const endAt = raw.endAt ? String(raw.endAt) : '';
        if (endAt && new Date(endAt) < new Date(startAt)) throw new Error(`Item ${index + 1} eindigt voor de start.`);

        if (raw.type === 'track' || Array.isArray(raw.points)) {
          const points = (raw.points || []).map((p, pointIndex) => {
            const lat = Number(p.lat);
            const lng = Number(p.lng);
            if (!validCoords(lat, lng)) throw new Error(`Track ${index + 1}, punt ${pointIndex + 1} heeft ongeldige coördinaten.`);
            return {
              lat, lng,
              time: String(p.time || new Date().toISOString()),
              accuracy: p.accuracy == null ? null : Number(p.accuracy),
              altitude: p.altitude == null ? null : Number(p.altitude),
              speed: p.speed == null ? null : Number(p.speed),
              heading: p.heading == null ? null : Number(p.heading),
              breakBefore: Boolean(p.breakBefore)
            };
          });
          return {
            id: String(raw.id || uuid()),
            type: 'track',
            active: false,
            title,
            note: String(raw.note || ''),
            category: String(raw.category || '').trim(),
            group: String(raw.group || '').trim(),
            startAt,
            endAt: endAt || startAt,
            points,
            events: Array.isArray(raw.events) ? raw.events : [],
            pendingGap: false,
            createdAt: raw.createdAt ? String(raw.createdAt) : new Date().toISOString(),
            // Geen updatedAt in de bron betekent onbekend, niet zojuist gewijzigd:
            // anders zou zo'n item bij samenvoegen altijd van een lokale versie winnen.
            updatedAt: raw.updatedAt ? String(raw.updatedAt) : (raw.createdAt ? String(raw.createdAt) : new Date().toISOString())
          };
        }

        const lat = Number(raw.lat);
        const lng = Number(raw.lng);
        if (!validCoords(lat, lng)) throw new Error(`Item ${index + 1} heeft ongeldige coördinaten.`);

        // occasions wins when present; a v7 file only has startAt/endAt and
        // becomes a single occasion.
        let occasions = sortOccasions(itemOccasions({ ...raw, startAt, endAt }));
        if (!occasions.length) occasions = [{ startAt, endAt }];
        const bad = occasions.find(occasion => occasion.endAt && occasion.endAt < occasion.startAt);
        if (bad) throw new Error(`Item ${index + 1} heeft een bezoek dat eindigt voor het begint.`);
        const span = occasionSpan(occasions);

        return {
          id: String(raw.id || uuid()),
          type: 'waypoint',
          title,
          note: String(raw.note || ''),
          category: String(raw.category || '').trim(),
          group: String(raw.group || '').trim(),
          occasions,
          startAt: span.startAt,
          endAt: span.endAt,
          lat, lng,
          address: String(raw.address || ''),
          createdAt: raw.createdAt ? String(raw.createdAt) : new Date().toISOString(),
          // Geen updatedAt in de bron betekent onbekend, niet zojuist gewijzigd:
          // anders zou zo'n item bij samenvoegen altijd van een lokale versie winnen.
          updatedAt: raw.updatedAt ? String(raw.updatedAt) : (raw.createdAt ? String(raw.createdAt) : new Date().toISOString())
        };
      }

      /* ------------------------------------------------------------------ *
       * GPX
       *
       * <wpt> becomes a waypoint, each <trk> a track with one segment per
       * <trkseg>, and a <rte> is treated as a track as well. Everything is
       * shaped into the same raw form the JSON importer already validates.
       * ------------------------------------------------------------------ */
      function gpxText(node, tag) {
        const found = node.getElementsByTagName(tag)[0];
        return found ? String(found.textContent || '').trim() : '';
      }

      // Eigen extensies teruglezen, zodat een eigen GPX verliesvrij terugkomt.
      function lwValue(node, name) {
        const direct = node.getElementsByTagNameNS(CONFIG.gpx.namespace, name)[0];
        if (direct) return String(direct.textContent || '').trim();
        const prefixed = node.getElementsByTagName(`${CONFIG.gpx.namespacePrefix}:${name}`)[0];
        return prefixed ? String(prefixed.textContent || '').trim() : '';
      }

      function lwNodes(node, name) {
        const direct = node.getElementsByTagNameNS(CONFIG.gpx.namespace, name);
        return direct.length ? [...direct] : [...node.getElementsByTagName(`${CONFIG.gpx.namespacePrefix}:${name}`)];
      }

      function gpxPoint(node) {
        const lat = Number(node.getAttribute('lat'));
        const lng = Number(node.getAttribute('lon'));
        if (!validCoords(lat, lng)) return null;
        const time = gpxText(node, 'time');
        const elevation = gpxText(node, 'ele');
        const accuracy = lwValue(node, 'accuracy');
        const speed = lwValue(node, 'speed');
        const profile = lwValue(node, 'profile');
        return {
          lat, lng,
          time: time || new Date().toISOString(),
          altitude: elevation ? Number(elevation) : null,
          accuracy: accuracy ? Number(accuracy) : null,
          speed: speed ? Number(speed) : null,
          heading: null,
          ...(profile ? { profile } : {}),
          breakBefore: false
        };
      }

      function parseGpx(text, fileName) {
        const doc = new DOMParser().parseFromString(text, 'application/xml');
        if (doc.getElementsByTagName('parsererror').length) throw new Error('Dit GPX-bestand kon niet gelezen worden.');
        const root = doc.documentElement;
        if (!root || root.nodeName.toLowerCase() !== 'gpx') throw new Error('Dit is geen GPX-bestand.');

        const metadata = root.getElementsByTagName('metadata')[0];
        const groupName = (metadata && gpxText(metadata, 'name')) ||
          String(fileName || '').replace(/\.gpx$/i, '').trim();
        const raw = [];

        for (const node of root.getElementsByTagName('wpt')) {
          const point = gpxPoint(node);
          if (!point) continue;
          const when = localDateTimeValue(new Date(point.time));
          // Bezoeken uit onze eigen extensie hebben voorrang op het ene <time>.
          const visits = lwNodes(node, 'visit').map(visit => ({
            startAt: visit.getAttribute('start') ? localDateTimeValue(new Date(visit.getAttribute('start'))) : '',
            endAt: visit.getAttribute('end') ? localDateTimeValue(new Date(visit.getAttribute('end'))) : ''
          })).filter(visit => visit.startAt);
          const address = lwValue(node, 'address') || gpxText(node, 'cmt');
          raw.push({
            id: lwValue(node, 'id') || undefined,
            type: 'waypoint',
            title: gpxText(node, 'name') || 'GPX-waypoint',
            note: gpxText(node, 'desc') || (address ? '' : gpxText(node, 'cmt')) || '',
            category: (gpxText(node, 'type') || gpxText(node, 'sym') || '').toLowerCase(),
            group: lwValue(node, 'group') || groupName,
            lat: point.lat, lng: point.lng,
            occasions: visits.length ? visits : [{ startAt: when, endAt: '' }],
            startAt: visits[0]?.startAt || when,
            endAt: visits.at(-1)?.endAt || '',
            address
          });
        }

        const trackNodes = [...root.getElementsByTagName('trk'), ...root.getElementsByTagName('rte')];
        for (const node of trackNodes) {
          const points = [];
          const segments = node.getElementsByTagName('trkseg');
          if (segments.length) {
            for (const segment of segments) {
              let first = true;
              for (const pointNode of segment.getElementsByTagName('trkpt')) {
                const point = gpxPoint(pointNode);
                if (!point) continue;
                // A new <trkseg> is exactly the gap this app already models.
                point.breakBefore = first && points.length > 0;
                first = false;
                points.push(point);
              }
            }
          } else {
            for (const pointNode of node.getElementsByTagName('rtept')) {
              const point = gpxPoint(pointNode);
              if (point) points.push(point);
            }
          }
          if (!points.length) continue;
          raw.push({
            // Bij een track die over middernacht liep, houdt elk dagdeel een
            // eigen id, anders zou het tweede deel het eerste overschrijven.
            id: lwNodes(node, 'part').length ? undefined : (lwValue(node, 'id') || undefined),
            type: 'track',
            title: gpxText(node, 'name') || groupName || 'GPX-track',
            note: gpxText(node, 'desc') || gpxText(node, 'cmt') || '',
            category: gpxText(node, 'type') || '',
            group: lwValue(node, 'group') || groupName,
            points,
            startAt: localDateTimeValue(new Date(points[0].time)),
            endAt: localDateTimeValue(new Date(points.at(-1).time))
          });
        }

        if (!raw.length) throw new Error('Dit GPX-bestand bevat geen waypoints, tracks of routes.');
        return raw;
      }

      const isGpxFile = (file, text) =>
        /\.gpx$/i.test(file.name || '') || /^\s*(<\?xml[^>]*\?>\s*)?<gpx[\s>]/i.test(text);

      /**
       * Wie wint bij hetzelfde item uit twee toestellen? De jongste wijziging.
       * Een ontbrekend tijdstempel telt als onbekend en verliest daarom van een
       * versie die er wel een heeft; zijn beide onbekend, dan wint de import,
       * want daar koos de gebruiker net voor.
       */
      function newerWins(incoming, existing) {
        const stamp = (item) => Date.parse(item?.updatedAt || item?.createdAt || '');
        const a = stamp(incoming);
        const b = stamp(existing);
        if (!Number.isFinite(a)) return !Number.isFinite(b);
        if (!Number.isFinite(b)) return true;
        return a >= b;
      }

      async function importJsonFile(file) {
        if (!file) return;
        try {
          const text = await file.text();
          let source;
          let exportedActive = [];

          if (isGpxFile(file, text)) {
            source = parseGpx(text, file.name);
          } else {
            const parsed = JSON.parse(text);
            source = Array.isArray(parsed) ? parsed : parsed?.items;
            if (!Array.isArray(source)) {
              throw new Error('Het bestand moet een JSON-export, een lijst met waypoints/tracks of een GPX-bestand zijn.');
            }
            // A recording that was still running when the file was exported is
            // imported as a finished track instead of being silently dropped.
            exportedActive = validTrackSnapshot(parsed?.activeTrack) ? [parsed.activeTrack] : [];
          }

          const imported = [...source, ...exportedActive].map(normalizeImportedItem);
          if (!imported.length) { toast('Dit bestand bevat geen items.'); return; }

          const merge = confirm(
            `${imported.length} item${imported.length === 1 ? '' : 's'} gevonden.\n\n` +
            `OK = SAMENVOEGEN met je huidige ${items.length} item${items.length === 1 ? '' : 's'} ` +
            '(bij hetzelfde item wint de nieuwste versie).\n' +
            'Annuleren = de huidige lijst VERVANGEN.'
          );

          const before = snapshot();

          if (merge) {
            const byId = new Map(items.map(item => [String(item.id), item]));
            const applied = [];
            let added = 0;
            let updated = 0;
            let kept = 0;
            for (const item of imported) {
              const existing = byId.get(String(item.id));
              if (!existing) {
                added++;
              } else if (newerWins(item, existing)) {
                updated++;
              } else {
                // Dit toestel heeft een jongere versie; die blijft staan.
                kept++;
                continue;
              }
              byId.set(String(item.id), item);
              applied.push(item);
            }
            items = [...byId.values()];
            // Alleen wegschrijven wat ook echt is overgenomen.
            await persistMany(applied);
            render();
            fitItems();
            offerUndo([
              `${added} toegevoegd`,
              `${updated} bijgewerkt`,
              kept ? `${kept} behouden (hier nieuwer)` : ''
            ].filter(Boolean).join(', ') + '.', before);
            return;
          }

          if (items.length && !confirm(
            `VERVANGEN: je huidige ${items.length} item${items.length === 1 ? '' : 's'} ` +
            `word${items.length === 1 ? 't' : 'en'} vervangen door ${imported.length}.\n\n` +
            'Doorgaan? Je kunt dit direct daarna ongedaan maken.'
          )) {
            toast('Import geannuleerd. Er is niets gewijzigd.');
            return;
          }

          items = imported;
          await replaceAll(items, activeTrack);
          render();
          fitItems();
          offerUndo(`${imported.length} item${imported.length === 1 ? '' : 's'} geïmporteerd.`, before);
        } catch (error) {
          alert(`Import mislukt: ${error?.message || 'ongeldig JSON-bestand.'}`);
        } finally {
          els.importInput.value = '';
        }
      }

      els.importBtn.addEventListener('click', () => els.importInput.click());
      els.importInput.addEventListener('change', () => void importJsonFile(els.importInput.files?.[0]));

      /* ------------------------------------------------------------------ *
       * GPX-export: één bestand per kalenderdag
       *
       * Een dag bevat de bezoeken die op die dag vallen en de trackpunten van
       * die dag. Wat GPX zelf kent (name, desc, cmt, type, time, ele) gaat in
       * de standaardvelden, zodat elke kaart-app het leest; alles daarbuiten
       * (groep, categorie, adres, meerdere bezoeken, snelheidsprofiel) staat
       * in extensions onder een eigen namespace, zodat een terug-import niets
       * verliest.
       * ------------------------------------------------------------------ */
      const xmlEscape = (value = '') => String(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;'
      }[ch]));

      // De dagsleutel is lokaal; de tijden in het bestand blijven UTC.
      function localDayKey(value) {
        const date = value instanceof Date ? value : new Date(value);
        if (Number.isNaN(date.getTime())) return '';
        const pad = n => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      }

      const isoTime = (value) => {
        const date = value instanceof Date ? value : new Date(value);
        return Number.isNaN(date.getTime()) ? '' : date.toISOString();
      };

      /**
       * Verdeelt alles over kalenderdagen.
       * Een waypoint verschijnt op elke dag waarop het bezocht is, met alleen
       * de bezoeken van die dag. Een track wordt op middernacht gesplitst,
       * waarbij de bestaande segmentgrenzen behouden blijven.
       */
      function groupByDay(list) {
        const days = new Map();
        const dayOf = (key) => {
          if (!days.has(key)) days.set(key, { key, waypoints: [], tracks: [] });
          return days.get(key);
        };

        for (const item of list) {
          if (isTrack(item)) {
            const points = (item.points || []).filter(point => validCoords(Number(point.lat), Number(point.lng)));
            if (!points.length) continue;

            if (!CONFIG.gpx.splitTracksAtMidnight) {
              dayOf(localDayKey(item.startAt || points[0].time)).tracks.push({ item, points });
              continue;
            }
            const perDay = new Map();
            for (const point of points) {
              const key = localDayKey(point.time);
              if (!perDay.has(key)) perDay.set(key, []);
              perDay.get(key).push(point);
            }
            const parts = [...perDay.entries()];
            parts.forEach(([key, dayPoints], index) => {
              dayOf(key).tracks.push({
                item, points: dayPoints,
                part: parts.length > 1 ? { index: index + 1, total: parts.length } : null
              });
            });
            continue;
          }

          if (!validCoords(Number(item.lat), Number(item.lng))) continue;
          const perDay = new Map();
          for (const occasion of sortOccasions(itemOccasions(item))) {
            const key = localDayKey(occasion.startAt);
            if (!key) continue;
            if (!perDay.has(key)) perDay.set(key, []);
            perDay.get(key).push(occasion);
          }
          if (!perDay.size) perDay.set(localDayKey(item.createdAt || Date.now()), []);
          for (const [key, visits] of perDay) dayOf(key).waypoints.push({ item, visits });
        }

        return [...days.values()].sort((a, b) => a.key.localeCompare(b.key));
      }

      function gpxBounds(day) {
        const coords = [];
        for (const entry of day.waypoints) coords.push([Number(entry.item.lat), Number(entry.item.lng)]);
        for (const entry of day.tracks) for (const point of entry.points) coords.push([Number(point.lat), Number(point.lng)]);
        if (!coords.length) return '';
        const lats = coords.map(c => c[0]);
        const lngs = coords.map(c => c[1]);
        return `<bounds minlat="${Math.min(...lats)}" minlon="${Math.min(...lngs)}"` +
          ` maxlat="${Math.max(...lats)}" maxlon="${Math.max(...lngs)}" />`;
      }

      function gpxForDay(day) {
        const ns = CONFIG.gpx.namespacePrefix;
        const fixed = (value) => Number(value).toFixed(CONFIG.gpx.decimals);
        const tag = (name, value) => (value === '' || value == null ? '' : `<${name}>${xmlEscape(value)}</${name}>`);

        let distance = 0;
        for (const entry of day.tracks) {
          for (let i = 1; i < entry.points.length; i++) {
            if (!entry.points[i].breakBefore) distance += distanceMetres(entry.points[i - 1], entry.points[i]);
          }
        }
        const groups = [...new Set([...day.waypoints, ...day.tracks]
          .map(entry => itemGroup(entry.item)).filter(Boolean))];
        const summary = [
          `${day.waypoints.length} waypoint${day.waypoints.length === 1 ? '' : 's'}`,
          `${day.tracks.length} track${day.tracks.length === 1 ? '' : 's'}`,
          distance ? formatDistance(distance) : ''
        ].filter(Boolean).join(', ');

        const waypoints = day.waypoints.map(({ item, visits }) => {
          const first = visits[0];
          const symbol = CONFIG.gpx.symbols[String(item.category || '').toLowerCase()];
          return `  <wpt lat="${fixed(item.lat)}" lon="${fixed(item.lng)}">
${first?.startAt ? `    <time>${isoTime(first.startAt)}</time>\n` : ''}    ${tag('name', item.title)}
    ${tag('desc', item.note)}
    ${tag('cmt', item.address)}
    ${tag('type', item.category)}
    ${symbol ? tag('sym', symbol) : ''}
    <extensions>
      ${tag(ns + ':id', item.id)}
      ${tag(ns + ':group', itemGroup(item))}
      ${tag(ns + ':address', item.address)}
${visits.map(visit => `      <${ns}:visit start="${xmlEscape(isoTime(visit.startAt))}"${visit.endAt ? ` end="${xmlEscape(isoTime(visit.endAt))}"` : ''} />`).join('\n')}
    </extensions>
  </wpt>`;
        }).join('\n');

        const tracks = day.tracks.map(({ item, points, part }) => {
          const segments = [];
          let current = [];
          points.forEach((point, index) => {
            if (index > 0 && point.breakBefore) { segments.push(current); current = []; }
            current.push(point);
          });
          if (current.length) segments.push(current);

          const body = segments.map(segment => `    <trkseg>
${segment.map(point => `      <trkpt lat="${fixed(point.lat)}" lon="${fixed(point.lng)}">` +
  (point.altitude == null ? '' : `<ele>${Number(point.altitude).toFixed(2)}</ele>`) +
  (point.time ? `<time>${isoTime(point.time)}</time>` : '') +
  ((point.accuracy != null || point.speed != null || point.profile)
    ? `<extensions>` +
      (point.accuracy == null ? '' : `<${ns}:accuracy>${Number(point.accuracy).toFixed(1)}</${ns}:accuracy>`) +
      (point.speed == null ? '' : `<${ns}:speed>${Number(point.speed).toFixed(2)}</${ns}:speed>`) +
      (point.profile ? `<${ns}:profile>${xmlEscape(point.profile)}</${ns}:profile>` : '') +
      `</extensions>`
    : '') +
  `</trkpt>`).join('\n')}
    </trkseg>`).join('\n');

          const name = part ? `${item.title} (${part.index}/${part.total})` : item.title;
          return `  <trk>
    ${tag('name', name)}
    ${tag('desc', item.note)}
    ${tag('type', item.category)}
    <extensions>
      ${tag(ns + ':id', item.id)}
      ${tag(ns + ':group', itemGroup(item))}
      ${part ? `<${ns}:part index="${part.index}" total="${part.total}" />` : ''}
    </extensions>
${body}
  </trk>`;
        }).join('\n');

        return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="${xmlEscape(CONFIG.gpx.creator)}"
     xmlns="http://www.topografix.com/GPX/1/1"
     xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
     xmlns:${ns}="${xmlEscape(CONFIG.gpx.namespace)}"
     xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    ${tag('name', `${day.key}${groups.length ? ' — ' + groups.join(', ') : ''}`)}
    ${tag('desc', summary)}
    <time>${new Date().toISOString()}</time>
    ${groups.length ? tag('keywords', groups.join(', ')) : ''}
    ${gpxBounds(day)}
    <extensions>
      <${ns}:day>${day.key}</${ns}:day>
      <${ns}:waypoints>${day.waypoints.length}</${ns}:waypoints>
      <${ns}:tracks>${day.tracks.length}</${ns}:tracks>
      ${distance ? `<${ns}:distance unit="m">${Math.round(distance)}</${ns}:distance>` : ''}
    </extensions>
  </metadata>
${waypoints}
${tracks}
</gpx>
`.replace(/^\s*\n/gm, '');
      }

      /* --- minimale ZIP (opgeslagen, niet gecomprimeerd) ------------------ *
       * Genoeg om meerdere dagbestanden als één download aan te bieden waar
       * het delen van meerdere bestanden niet werkt; scheelt een bibliotheek.
       * ------------------------------------------------------------------ */
      const CRC_TABLE = (() => {
        const table = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
          let c = i;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
          table[i] = c >>> 0;
        }
        return table;
      })();

      function crc32(bytes) {
        let crc = 0xFFFFFFFF;
        for (const byte of bytes) crc = CRC_TABLE[(crc ^ byte) & 0xFF] ^ (crc >>> 8);
        return (crc ^ 0xFFFFFFFF) >>> 0;
      }

      function zipStore(files) {
        const encoder = new TextEncoder();
        const u16 = (v) => [v & 0xFF, (v >>> 8) & 0xFF];
        const u32 = (v) => [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF];
        // ZIP bewaart tijden in het oude MS-DOS-formaat; een nul daarin leest
        // als 1980-00-00, wat sommige uitpakkers als ongeldig aanmerken.
        const now = new Date();
        const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
        const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

        const parts = [];      // lokale headers + namen + inhoud
        const entries = [];    // wat straks in de centrale map moet
        let offset = 0;

        for (const file of files) {
          const name = encoder.encode(file.name);
          const data = encoder.encode(file.text);
          const crc = crc32(data);
          const local = new Uint8Array([
            ...u32(0x04034b50),        // signatuur lokale header
            ...u16(20), ...u16(0x0800), ...u16(0),   // versie, vlaggen (UTF-8), methode (0 = opgeslagen)
            ...u16(dosTime), ...u16(dosDate),
            ...u32(crc), ...u32(data.length), ...u32(data.length),
            ...u16(name.length), ...u16(0)
          ]);
          const central = new Uint8Array([
            ...u32(0x02014b50),        // signatuur centrale map
            ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0),
            ...u16(dosTime), ...u16(dosDate),
            ...u32(crc), ...u32(data.length), ...u32(data.length),
            ...u16(name.length), ...u16(0), ...u16(0),
            ...u16(0), ...u16(0), ...u32(0),
            ...u32(offset)             // waar de lokale header begint
          ]);
          parts.push(local, name, data);
          entries.push({ central, name });
          offset += local.length + name.length + data.length;
        }

        const directory = [];
        let directorySize = 0;
        for (const entry of entries) {
          directory.push(entry.central, entry.name);
          directorySize += entry.central.length + entry.name.length;
        }
        const end = new Uint8Array([
          ...u32(0x06054b50), ...u16(0), ...u16(0),
          ...u16(files.length), ...u16(files.length),
          ...u32(directorySize), ...u32(offset), ...u16(0)
        ]);
        return new Blob([...parts, ...directory, end], { type: 'application/zip' });
      }

      function buildGpxFiles() {
        const all = activeTrack ? [...items, activeTrack] : items;
        return groupByDay(all).map(day => ({
          name: CONFIG.gpx.fileNamePattern.replace('{date}', day.key),
          text: gpxForDay(day),
          day: day.key
        }));
      }

      async function exportGpxPerDay() {
        const files = buildGpxFiles();
        if (!files.length) { toast('Er is nog niets om te exporteren.'); return; }

        const blobs = files.map(file => new File([file.text], file.name, { type: 'application/gpx+xml' }));
        // Meerdere bestanden tegelijk delen werkt op iOS; dat is hier de
        // prettigste route naar Bestanden, AirDrop of mail.
        if (navigator.canShare?.({ files: blobs })) {
          try {
            await navigator.share({ files: blobs, title: `GPX per dag (${files.length})` });
            return;
          } catch (error) {
            if (error?.name === 'AbortError') return;
          }
        }
        if (files.length === 1) {
          downloadBlob(blobs[0], files[0].name);
          toast(`${files[0].name} geëxporteerd.`);
          return;
        }
        downloadBlob(zipStore(files), CONFIG.gpx.zipName.replace('{date}', localDayKey(new Date())));
        toast(`${files.length} dagbestanden in één zip geëxporteerd.`);
      }

      function exportJsonBackup() {
        const payload = {
          schema: 'local-waypoints-v8',
          exportedAt: new Date().toISOString(),
          storageKey: STORAGE_KEY,
          count: items.length,
          activeTrack,
          items
        };
        downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }),
          `waypoints-${new Date().toISOString().replace(/[:.]/g, '-')}.json`);
        toast(`${items.length} item${items.length === 1 ? '' : 's'} geëxporteerd.`);
      }

      els.exportBtn.addEventListener('click', async () => {
        const days = buildGpxFiles().length;
        const choice = await chooseAction('Exporteren', 'JSON is de volledige back-up; GPX is voor andere kaart-apps.', [
          { label: 'JSON — volledige back-up', detail: 'Alles in één bestand, kan hier weer ingelezen worden', value: 'json', primary: true },
          { label: 'GPX per dag', detail: days
              ? `${days} dagbestand${days === 1 ? '' : 'en'} met tracks, waypoints en metadata`
              : 'Nog niets om te exporteren', value: 'gpx' }
        ]);
        if (choice === 'json') exportJsonBackup();
        else if (choice === 'gpx') await exportGpxPerDay();
      });

      /* ------------------------------------------------------------------ *
       * Refresh from server (keeps local data)
       * ------------------------------------------------------------------ */
      async function refreshHtmlFromServer() {
        // De gegevens staan al in IndexedDB; een herlaadbeurt raakt ze niet.
        saveActiveTrack();

        const target = new URL(location.href);
        target.searchParams.set(REFRESH_QUERY_KEY, String(Date.now()));
        target.hash = '';

        els.refreshBtn.disabled = true;
        toast('Nieuwe serverversie ophalen…');
        try {
          await fetch(target.href, {
            method: 'GET',
            cache: 'no-store',
            credentials: 'same-origin',
            headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
          });
        } catch {
          // Navigation may still succeed when the preflight is blocked.
        }
        location.replace(target.href);
      }
      els.refreshBtn.addEventListener('click', () => void refreshHtmlFromServer());

      /* ------------------------------------------------------------------ *
       * Map interaction & current location
       * ------------------------------------------------------------------ */
      els.addBtn.addEventListener('click', () => openModal(null, lastKnownPosition));
      // Long press (iOS Safari fires contextmenu via Leaflet's tap-hold) adds a
      // waypoint exactly there. A plain tap only clears the selection, so an
      // accidental touch while panning never opens the editor.
      map.on('contextmenu', event => openModal(null, event.latlng));
      map.on('click', () => clearSelection());

      els.fitBtn.addEventListener('click', () => {
        // With items activated this frames the selection; only with an empty
        // selection does it fall back to everything.
        if (selection.size) {
          clearTimeout(fitTimer);
          if (!fitSelection()) toast('De selectie heeft geen positie op de kaart.');
          return;
        }
        if (!fitItems()) toast('Nog niets om te tonen.');
      });

      els.layersBtn.addEventListener('click', async () => {
        const chosen = await chooseAction('Kaartlaag', 'Geldt voor de kaart, het bewerkscherm en de gedeelde afbeelding.',
          Object.entries(BASEMAPS).map(([key, config]) => ({
            label: config.name + (key === basemapKey ? ' ✓' : ''),
            detail: config.detail,
            value: key,
            primary: key === basemapKey
          })));
        if (chosen) applyBasemap(chosen);
      });

      els.locateBtn.addEventListener('click', () => {
        autoFollowPausedUntil = 0;
        if (lastKnownPosition) {
          map.setView([lastKnownPosition.lat, lastKnownPosition.lng], Math.max(map.getZoom(), CONFIG.map.singleItemZoom));
          return;
        }
        if (!navigator.geolocation) { toast('Locatiebepaling is niet beschikbaar.'); return; }
        toast('Locatie bepalen…');
        navigator.geolocation.getCurrentPosition(
          position => { updateCurrentLocation(position); map.setView([position.coords.latitude, position.coords.longitude], 16); },
          () => toast('Huidige locatie kon niet worden opgehaald.'),
          { enableHighAccuracy: true, timeout: CONFIG.map.locateTimeoutMs, maximumAge: 0 }
        );
      });

      function installMapInteractionGuard() {
        const container = map.getContainer();
        for (const type of ['pointerdown', 'touchstart', 'wheel']) {
          container.addEventListener(type, () => pauseAutoFollow(CONFIG.map.autoFollowPauseMs), { passive: true });
        }
        container.addEventListener('keydown', () => pauseAutoFollow(CONFIG.map.autoFollowPauseMs));
      }

      function updateCurrentLocation(position) {
        const { latitude: lat, longitude: lng, accuracy } = position.coords;
        lastKnownPosition = { lat, lng, accuracy, time: Date.now() };

        if (!locationMarker) {
          locationMarker = L.circleMarker([lat, lng], {
            radius: 7, weight: 3, color: '#fff', fillColor: '#0a84ff', fillOpacity: 1
          }).addTo(map).bindTooltip('Huidige locatie');
        } else {
          locationMarker.setLatLng([lat, lng]);
        }

        const modalOpen = els.modal.classList.contains('open') || els.trackModal.classList.contains('open');
        const itemIdle = Date.now() - lastItemInteractionAt >= CONFIG.map.itemIdleMs;
        const mapIdle = Date.now() >= autoFollowPausedUntil;
        if (!modalOpen && itemIdle && mapIdle && !selection.size) {
          map.panTo([lat, lng], { animate: true, duration: .5 });
        }
      }

      function startLocationFollowing() {
        if (!navigator.geolocation || locationWatchId !== null) return;
        locationWatchId = navigator.geolocation.watchPosition(
          updateCurrentLocation,
          () => {},
          { enableHighAccuracy: true, maximumAge: 3000, timeout: CONFIG.map.locateTimeoutMs }
        );
      }

      /* ------------------------------------------------------------------ *
       * Resizable map/list split
       * ------------------------------------------------------------------ */
      function getSplit() {
        const value = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--split'));
        return Number.isFinite(value) ? value / 100 : SPLIT_PRESETS[0];
      }

      function setSplit(fraction, persist = true) {
        const clamped = Math.min(CONFIG.ui.splitMax, Math.max(CONFIG.ui.splitMin, fraction));
        document.documentElement.style.setProperty('--split', `${(clamped * 100).toFixed(2)}%`);
        if (persist) { try { localStorage.setItem(SPLIT_KEY, String(clamped)); } catch {} }
        map.invalidateSize({ animate: false });
      }

      function installSplitter() {
        const stored = Number.parseFloat(localStorage.getItem(SPLIT_KEY) || '');
        if (Number.isFinite(stored)) setSplit(stored, false);

        let dragging = false;
        let moved = false;
        let startY = 0;

        els.grabber.addEventListener('pointerdown', event => {
          if (window.innerWidth >= CONFIG.ui.wideScreenPx) return;
          dragging = true;
          moved = false;
          startY = event.clientY;
          els.grabber.setPointerCapture(event.pointerId);
        });

        els.grabber.addEventListener('pointermove', event => {
          if (!dragging) return;
          if (Math.abs(event.clientY - startY) > 4) moved = true;
          setSplit(event.clientY / window.innerHeight, false);
          event.preventDefault();
        });

        const finish = () => {
          if (!dragging) return;
          dragging = false;
          if (moved) { setSplit(getSplit()); return; }
          const current = getSplit();
          const next = SPLIT_PRESETS.find(preset => preset < current - 0.03) ?? SPLIT_PRESETS.at(-1);
          setSplit(next);
        };
        els.grabber.addEventListener('pointerup', finish);
        els.grabber.addEventListener('pointercancel', finish);
      }

      map.on('zoomend', applyZoomScale);

      window.addEventListener('resize', () => map.invalidateSize());
      window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 250));
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        if (els.chooseModal.classList.contains('open')) els.chooseCloseBtn.click();
        else if (els.modal.classList.contains('open')) closeModal();
        else if (els.trackModal.classList.contains('open')) closeTrackModal();
        else clearSelection();
      });

      /* ------------------------------------------------------------------ *
       * Boot
       * ------------------------------------------------------------------ */
      // Best effort: ask the browser not to evict this origin's storage under
      // disk pressure. Chrome and Firefox honour it; Safari ignores it, where
      // adding the page to the home screen is what keeps storage durable.
      function requestPersistentStorage() {
        try { void navigator.storage?.persist?.(); } catch {}
      }

      async function initializeApp() {
        requestPersistentStorage();
        try {
          db = await openDatabase();
          const loaded = await loadEverything();
          items = loaded.items;
          activeTrack = loaded.activeTrack;
        } catch (error) {
          console.error(error);
          alert('De lokale database kon niet worden geopend. Zonder opslag gaat nieuw werk verloren; '
            + 'in privénavigatie is IndexedDB soms geblokkeerd.');
        }

        installSplitter();
        installMapInteractionGuard();
        startLocationFollowing();

        if (activeTrack?.active) {
          activeTrack.pendingGap = true;
          activeTrack.events = Array.isArray(activeTrack.events) ? activeTrack.events : [];
          activeTrack.events.push({ time: new Date().toISOString(), type: 'session-recovered' });
          activeTrack.updatedAt = new Date().toISOString();
          saveActiveTrack();
          trackingProfile = profileById(activeTrack.profile) || trackingProfiles()[0];
          // Na herstel opnieuw kort opwarmen: de snelheid van nu is onbekend.
          activeTrack.startedMs = Date.now();
          startTrackingTimer();
          setTimeout(() => toast('Lopende track hersteld en hervat als nieuw segment.'), 400);
        }

        render();
        setTimeout(() => { map.invalidateSize(); fitItems(); }, 120);

        try {
          const cleanUrl = new URL(location.href);
          if (cleanUrl.searchParams.has(REFRESH_QUERY_KEY)) {
            cleanUrl.searchParams.delete(REFRESH_QUERY_KEY);
            history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
          }
        } catch {
          // URL cleanup is cosmetic only.
        }

        if (!localStorage.getItem(HINT_KEY)) {
          try { localStorage.setItem(HINT_KEY, '1'); } catch {}
          setTimeout(() => toast('Tip: houd de kaart ingedrukt voor een waypoint op die plek.'), 1500);
        }
      }

      void initializeApp();
    })();
  </script>
</body>
</html>
