            dashArray: trackStep.dash,
            interactive: false,
            renderer: trackRenderer
          }).addTo(map);
          line.bringToBack();
          groupLines.set(name, { line, sig: signature });
        }
      }

      function syncActiveTrackLayer(rebuild = false) {
        if (!activeTrack) {
          if (activeTrackLayer) { map.removeLayer(activeTrackLayer); activeTrackLayer = null; }
          activeTrackSegment = null;
          return;
        }
        if (activeTrackLayer && !rebuild) return;
        if (activeTrackLayer) map.removeLayer(activeTrackLayer);
        activeTrackLayer = buildTrackGroup(activeTrack, ACTIVE_TRACK_STYLE).addTo(map);
        const layers = activeTrackLayer.getLayers();
        const last = layers[layers.length - 1];
        activeTrackSegment = last && last.addLatLng ? last : null;
      }

      // Cheap in-place update while recording: extend the drawn line and
      // refresh only the summary line of the active track row.
      function appendActiveTrackPoint(point) {
        if (!activeTrackLayer) { syncActiveTrackLayer(true); return; }
        const latlng = [point.lat, point.lng];
        if (point.breakBefore || !activeTrackSegment) {
          activeTrackSegment = L.polyline([latlng], { ...ACTIVE_TRACK_STYLE }).addTo(activeTrackLayer);
        } else {
          activeTrackSegment.addLatLng(latlng);
        }
        updateActiveTrackRow();
      }

      // Alleen de samenvattingsregel van de lopende track bijwerken.
      function updateActiveTrackRow() {
        if (!activeTrack) return;
        const row = els.items.querySelector(`.item[data-id="${CSS.escape(String(activeTrack.id))}"] [data-role="summary"]`);
        if (row) row.textContent = trackSummary(activeTrack);
        else render();
      }

      function render() {
        renderList();
        syncMapLayers();
        applySelectionStyles();
        updateRecordButton();
      }

      /* ------------------------------------------------------------------ *
       * Selection - list <-> map, in both directions
       * ------------------------------------------------------------------ */
      function findItem(id) {
        const key = String(id);
        if (activeTrack && String(activeTrack.id) === key) return activeTrack;
        return items.find(candidate => String(candidate.id) === key) || null;
      }

      const isSelected = (id) => selection.has(String(id));

      function applySelectionStyles() {
        const active = selection.size > 0;

        els.items.querySelectorAll('.item').forEach(row =>
          row.classList.toggle('selected', isSelected(row.dataset.id)));

        markers.forEach(({ marker }, id) => {
          const on = isSelected(id);
          marker.setZIndexOffset(on ? 1000 : 0);
          const element = marker.getElement();
          element?.classList.toggle('sel', on);
          element?.classList.toggle('dim', active && !on);
        });

        const restyle = (group, style, on) => group?.eachLayer(layer => layer.setStyle && layer.setStyle(
          on ? { weight: scaledWeight(style) + CONFIG.tracks.selectedExtraWeight, opacity: 1, color: CONFIG.tracks.colorSelected }
             : { weight: scaledWeight(style), opacity: active ? style.opacity * CONFIG.tracks.dimFactor : style.opacity, color: style.color }));
        trackLayers.forEach((entry, id) => restyle(entry.group, TRACK_STYLE, isSelected(id)));
        if (activeTrack) restyle(activeTrackLayer, ACTIVE_TRACK_STYLE, isSelected(activeTrack.id));

        updateGroupHeads();
        els.count.classList.toggle('has-selection', active);
        els.count.textContent = active
          ? `${selection.size} geselecteerd`
          : `${(activeTrack ? 1 : 0) + items.length} item${(activeTrack ? 1 : 0) + items.length === 1 ? '' : 's'}`;
        els.shareSelBtn.hidden = !active;
        els.clearSelBtn.hidden = !active;
        els.fitBtn.title = active ? 'Toon selectie' : 'Toon alles';
        els.fitBtn.setAttribute('aria-label', active ? 'Toon de selectie op de kaart' : 'Toon alles op de kaart');
      }

      // Heading badge shows "selected/total" and lights up when the whole group
      // is active; updated in place so scroll position survives.
      function updateGroupHeads() {
        const heads = els.items.querySelectorAll('.group-head');
        if (!heads.length) return;
        const sections = new Map(groupedSections().map(section => [section.name, section.items]));
        heads.forEach(head => {
          const members = sections.get(head.dataset.group) || [];
          const count = members.filter(member => isSelected(member.id)).length;
          head.classList.toggle('all-selected', members.length > 0 && count === members.length);
          const badge = head.querySelector('.group-count');
          if (badge) badge.textContent = count ? `${count}/${members.length}` : String(members.length);
        });
      }

      function layerBoundsFor(id) {
        const group = activeTrack && String(activeTrack.id) === String(id)
          ? activeTrackLayer
          : trackLayers.get(String(id))?.group;
        const bounds = group?.getBounds?.();
        return bounds && bounds.isValid() ? bounds : null;
      }

      // Every activated item, waypoints as points and tracks as their extent.
      function selectionBounds() {
        const coordinates = [];
        for (const id of selection) {
          const item = findItem(id);
          if (!item) continue;
          if (isTrack(item)) {
            const bounds = layerBoundsFor(id);
            if (bounds) coordinates.push(bounds.getNorthWest(), bounds.getSouthEast());
            else for (const point of item.points || []) coordinates.push([point.lat, point.lng]);
          } else {
            coordinates.push([item.lat, item.lng]);
          }
        }
        if (!coordinates.length) return null;
        const bounds = L.latLngBounds(coordinates);
        return bounds.isValid() ? bounds : null;
      }

      // "Show exactly the selection": frame the map on everything activated.
      function fitSelection() {
        const bounds = selectionBounds();
        if (!bounds) return false;
        pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs);
        // Tapping several items in quick succession would otherwise leave the
        // map on the first fit: Leaflet ignores a move issued mid-animation.
        map.stop();
        if (bounds.getNorthEast().equals(bounds.getSouthWest())) {
          map.setView(bounds.getCenter(), Math.max(map.getZoom(), CONFIG.map.singleItemZoom), { animate: true });
        } else {
          map.fitBounds(bounds, { ...fitPadding(), maxZoom: CONFIG.map.fitMaxZoom, animate: true });
        }
        return true;
      }

      function scrollListTo(id) {
        const row = els.items.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
        if (!row) return;
        if (getSplit() > 0.8) setSplit(SPLIT_PRESETS[0]); // make sure the list is visible
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      /**
       * Single entry point for both directions.
       *  - fromList (default): move the map to the item.
       *  - fromMap: scroll the list to the item.
       * Replaces the selection; use toggleItem to activate several at once.
       */
      function selectItem(id, { fromMap = false } = {}) {
        const key = String(id);
        const item = findItem(key);
        if (!item) return;

        selection.clear();
        selection.add(key);
        lastItemInteractionAt = Date.now();
        pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs);
        map.stop();
        applySelectionStyles();

        if (fromMap) {
          scrollListTo(key);
          return;
        }

        if (isTrack(item)) {
          const bounds = layerBoundsFor(key);
          if (bounds) map.fitBounds(bounds, { ...fitPadding(), maxZoom: CONFIG.map.fitMaxZoom, animate: true });
          else toast('Deze track heeft nog geen GPS-punten.');
          return;
        }

        map.setView([item.lat, item.lng], Math.max(map.getZoom(), CONFIG.map.singleItemZoom), { animate: true });
        markers.get(key)?.marker.openPopup();
      }

      // Reframing is debounced: tapping four items in a row should settle on
      // one view of all four, not race through four separate animations.
      let fitTimer = 0;
      function scheduleFitSelection(delay = 160) {
        clearTimeout(fitTimer);
        fitTimer = setTimeout(() => {
          fitTimer = 0;
          fitSelection();
          // With exactly one item active there is no ambiguity about which
          // popup is meant, so show it; with several it would just be noise.
          if (selection.size === 1) markers.get([...selection][0])?.marker.openPopup();
        }, delay);
      }

      // Add or remove one item, then reframe the map on everything selected.
      function toggleItem(id) {
        const key = String(id);
        if (!findItem(key)) return;
        if (!selection.delete(key)) selection.add(key);
        lastItemInteractionAt = Date.now();
        map.closePopup();
        applySelectionStyles();
        if (selection.size) scheduleFitSelection();
      }

      function clearSelection() {
        if (!selection.size) return;
        clearTimeout(fitTimer);
        selection.clear();
        map.closePopup();
        applySelectionStyles();
      }

      function fitItems() {
        const coordinates = [];
        for (const item of items) {
          if (isTrack(item)) for (const p of item.points || []) coordinates.push([p.lat, p.lng]);
          else coordinates.push([item.lat, item.lng]);
        }
        for (const p of activeTrack?.points || []) coordinates.push([p.lat, p.lng]);
        if (!coordinates.length) return false;
        pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs);
        map.stop();
        map.fitBounds(L.latLngBounds(coordinates), { ...fitPadding(), maxZoom: CONFIG.map.fitAllMaxZoom });
        return true;
      }

      /* ------------------------------------------------------------------ *
       * List interaction
       * ------------------------------------------------------------------ */
      els.items.addEventListener('click', (event) => {
        lastItemInteractionAt = Date.now();
        const action = event.target.closest('[data-action]')?.dataset.action;

        const head = event.target.closest('.group-head');
        if (head) {
          const name = head.dataset.group;
          if (action === 'collapse') {
            setCollapsed(name, !isCollapsed(name));
            render();
            return;
          }
          // Tapping the heading activates or clears the whole group at once,
          // which is what you want before sharing a trip.
          const members = groupedSections().find(section => section.name === name)?.items || [];
          const allSelected = members.length > 0 && members.every(member => isSelected(member.id));
          for (const member of members) {
            allSelected ? selection.delete(String(member.id)) : selection.add(String(member.id));
          }
          map.closePopup();
          applySelectionStyles();
          if (selection.size) scheduleFitSelection();
          return;
        }

        const article = event.target.closest('.item');
        if (!article) return;
        const item = findItem(article.dataset.id);
        if (!item) return;

        if (action === 'edit') { isTrack(item) ? openTrackModal(item) : openModal(item); return; }
        toggleItem(item.id);   // tapping the card itself is the selection gesture
      });

      // Deleting lives in the editor now, so a mistap in the list can never
      // remove anything.
      function deleteItem(item) {
        if (!item || item.active) return false;
        if (!confirm(`Verwijder “${item.title}”?`)) return false;
        const before = snapshot();
        items = items.filter(candidate => String(candidate.id) !== String(item.id));
        selection.delete(String(item.id));
        void removeItemFromDb(item.id);
        render();
        offerUndo(isTrack(item) ? 'Track verwijderd.' : 'Waypoint verwijderd.', before);
        return true;
      }

      els.deleteBtn.addEventListener('click', () => {
        const item = items.find(candidate => String(candidate.id) === els.id.value);
        if (deleteItem(item)) closeModal(true);
      });

      els.trackDeleteBtn.addEventListener('click', () => {
        const track = findItem(els.trackId.value);
        if (deleteItem(track)) closeTrackModal(true);
      });

      /* ------------------------------------------------------------------ *
       * Waypoint modal
       * ------------------------------------------------------------------ */
      function occasionRowHtml(occasion, index, total) {
        return `
          <div class="occasion" data-occasion>
            <div class="occasion-head">
              <span class="occasion-num">Bezoek ${index + 1}</span>
              <button class="mini delete" type="button" data-action="remove-occasion"
                aria-label="Bezoek ${index + 1} verwijderen"${total > 1 ? '' : ' hidden'}>×</button>
            </div>
            <div class="row2">
              <div class="field">
                <label>Start</label>
                <input type="datetime-local" data-role="start" value="${escapeHtml(occasion.startAt || '')}" aria-label="Start bezoek ${index + 1}" />
              </div>
              <div class="field">
                <label>Einde</label>
                <input type="datetime-local" data-role="end" value="${escapeHtml(occasion.endAt || '')}" aria-label="Einde bezoek ${index + 1}" />
              </div>
            </div>
          </div>`;
      }

      function readOccasionRows() {
        return [...els.occasions.querySelectorAll('[data-occasion]')].map(row => ({
          startAt: row.querySelector('[data-role="start"]').value,
          endAt: row.querySelector('[data-role="end"]').value
        }));
      }

      // Always renders at least one row, so a waypoint can never end up with
      // no moment at all.
      function renderOccasions(list) {
        const rows = list.length ? list : [{ startAt: localDateTimeValue(), endAt: '' }];
        els.occasions.innerHTML = rows.map((occasion, index) => occasionRowHtml(occasion, index, rows.length)).join('');
      }

      els.addOccasionBtn.addEventListener('click', () => {
        renderOccasions([...readOccasionRows(), { startAt: localDateTimeValue(), endAt: '' }]);
        const rows = els.occasions.querySelectorAll('[data-occasion] [data-role="start"]');
        const last = rows[rows.length - 1];
        last?.scrollIntoView({ block: 'nearest' });
        last?.focus();
      });

      els.occasions.addEventListener('click', event => {
        const button = event.target.closest('[data-action="remove-occasion"]');
        if (!button) return;
        const rows = [...els.occasions.querySelectorAll('[data-occasion]')];
        const index = rows.indexOf(button.closest('[data-occasion]'));
        const values = readOccasionRows();
        values.splice(index, 1);
        renderOccasions(values);
      });

      function serializeWaypointForm() {
        return JSON.stringify([els.id.value, els.title.value, els.note.value,
          els.category.value, els.group.value,
          readOccasionRows(), els.lat.value, els.lng.value, els.address.value]);
      }

      // Datalists grow with whatever the user has typed before.
      function fillDatalist(element, values) {
        element.replaceChildren(...values.map(value => {
          const option = document.createElement('option');
          option.value = value;
          return option;
        }));
      }

      function refreshDatalists() {
        const collect = (read) => [...new Set(items.map(read).map(v => String(v || '').trim()).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b));
        fillDatalist(els.groupOptions, collect(item => item.group));
        const used = collect(item => item.category);
        const merged = [...CONFIG.ui.categories];
        for (const value of used) {
          if (!merged.some(existing => existing.toLowerCase() === value.toLowerCase())) merged.push(value);
        }
        fillDatalist(els.categoryOptions, merged);
      }

      function serializeTrackForm() {
        return JSON.stringify([els.trackId.value, els.trackTitle.value, els.trackNote.value,
          els.trackCategory.value, els.trackGroup.value, els.trackMode.value,
          els.trackStartAt.value, els.trackEndAt.value]);
      }

      function ensureModalMap(lat, lng) {
        if (!modalMap) {
          modalMap = L.map('modalMap', { zoomControl: true, attributionControl: false, preferCanvas: true });
          modalBaseLayer = createTileLayer({ keepBuffer: 1 }).addTo(modalMap);
          modalMap.on('click', async event => {
            pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs);
            setCoords(event.latlng.lat, event.latlng.lng);
            modalMapMarker?.setLatLng(event.latlng);
            await reverseGeocode(event.latlng.lat, event.latlng.lng, false);
          });
        }
        modalMap.setView([lat, lng], 16);
        setTimeout(() => modalMap.invalidateSize(), 80);
      }

      function createDraftMarker(lat, lng) {
        ensureModalMap(lat, lng);
        if (modalMapMarker) modalMap.removeLayer(modalMapMarker);
        modalMapMarker = L.marker([lat, lng], { draggable: true, icon: iconFor({ title: '' }, MARKER_TIERS[0]) }).addTo(modalMap);
        modalMapMarker.on('dragstart', () => pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs));
        modalMapMarker.on('dragend', async () => {
          const pos = modalMapMarker.getLatLng();
          setCoords(pos.lat, pos.lng);
          await reverseGeocode(pos.lat, pos.lng, false);
        });
      }

      function openModal(item = null, coords = null) {
        const isEdit = Boolean(item);
        els.form.reset();
        els.placeSearch.value = '';
        hideSearchResults();
        els.id.value = item?.id || '';
        els.title.value = item?.title || '';
        els.note.value = item?.note || '';
        els.category.value = item?.category || '';
        els.group.value = item?.group || lastUsedGroup;
        refreshDatalists();
        renderOccasions(item ? sortOccasions(itemOccasions(item)) : []);
        els.address.value = item?.address || '';
        els.modalTitle.textContent = isEdit ? 'Waypoint bewerken' : 'Waypoint toevoegen';
        els.deleteBtn.hidden = !isEdit || !items.some(candidate => String(candidate.id) === String(item.id));

        const lat = item?.lat ?? coords?.lat ?? map.getCenter().lat;
        const lng = item?.lng ?? coords?.lng ?? map.getCenter().lng;
        setCoords(lat, lng);

        lastResolvedCoords = item?.address ? { lat: Number(lat), lng: Number(lng) } : null;
        createDraftMarker(Number(lat), Number(lng));

        els.modal.classList.add('open');
        document.body.classList.add('modal-visible');
        setTimeout(() => { modalMap?.invalidateSize(); if (!isEdit) els.title.focus(); }, 120);

        if (!item?.address) void reverseGeocode(Number(lat), Number(lng), true);
        setTimeout(() => { waypointFormBaseline = serializeWaypointForm(); }, 0);
      }

      function syncModalVisibleClass() {
        const open = [els.modal, els.trackModal, els.chooseModal].some(element => element.classList.contains('open'));
        document.body.classList.toggle('modal-visible', open);
      }

      function closeModal(force = false) {
        if (force !== true && els.modal.classList.contains('open') &&
            serializeWaypointForm() !== waypointFormBaseline &&
            !confirm('Je hebt niet-opgeslagen wijzigingen. Toch sluiten?')) {
          return false;
        }
        els.modal.classList.remove('open');
        syncModalVisibleClass();
        if (modalMapMarker && modalMap) { modalMap.removeLayer(modalMapMarker); modalMapMarker = null; }
        lastResolvedCoords = null;
        hideSearchResults();
        waypointFormBaseline = '';
        return true;
      }

      els.form.addEventListener('submit', (event) => {
        event.preventDefault();
        const { lat, lng } = readCoords();
        if (!validCoords(lat, lng)) { toast('Latitude of longitude is ongeldig.'); return; }

        const entered = readOccasionRows().filter(occasion => occasion.startAt || occasion.endAt);
        if (!entered.length) { toast('Voeg minstens één bezoek toe.'); return; }
        if (entered.some(occasion => !occasion.startAt)) {
          toast('Elk bezoek heeft een startmoment nodig.');
          return;
        }
        if (entered.some(occasion => occasion.endAt && occasion.endAt < occasion.startAt)) {
          toast('Het einde van een bezoek moet na de start liggen.');
          return;
        }
        const occasions = sortOccasions(entered);
        if (overlappingOccasions(occasions) &&
            !confirm('Twee bezoeken overlappen elkaar in tijd. Toch bewaren?')) return;
        const span = occasionSpan(occasions);

        const index = items.findIndex(candidate => String(candidate.id) === els.id.value);
        const previous = index >= 0 ? items[index] : null;
        const item = {
          id: previous?.id || uuid(),
          type: 'waypoint',
          title: els.title.value.trim(),
          note: els.note.value.trim(),
          category: els.category.value.trim(),
          group: els.group.value.trim(),
          occasions,
          startAt: span.startAt,
          endAt: span.endAt,
          lat, lng,
          address: els.address.value.trim(),
          createdAt: previous?.createdAt || new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };

        if (index >= 0) items[index] = { ...item, seq: previous.seq };
        else items.unshift(withSeq(item));

        lastUsedGroup = item.group;
        void persistItem(items[index >= 0 ? index : 0]);
        waypointFormBaseline = serializeWaypointForm();
        closeModal(true);
        selection.clear();
        selection.add(String(item.id));
        render();
        scrollListTo(String(item.id));
        const visits = occasions.length > 1 ? ` (${occasions.length} bezoeken)` : '';
        toast((index >= 0 ? 'Waypoint bijgewerkt' : 'Waypoint bewaard') + visits + '.');
      });

      els.closeBtn.addEventListener('click', () => closeModal());
      els.cancelBtn.addEventListener('click', () => closeModal());
      els.modal.addEventListener('click', event => { if (event.target === els.modal) closeModal(); });

      /* ------------------------------------------------------------------ *
       * Geocoding
       * ------------------------------------------------------------------ */
      async function fetchJson(url, timeoutMs = CONFIG.geocoding.timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(url, { headers: { 'Accept': 'application/json' }, signal: controller.signal });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } finally {
          clearTimeout(timer);
        }
      }

      function photonLabel(properties = {}) {
        const street = [properties.street, properties.housenumber].filter(Boolean).join(' ');
        const place = properties.city || properties.town || properties.village || properties.hamlet || properties.county;
        return [properties.name, street, properties.postcode, place, properties.state, properties.country]
          .filter(Boolean)
          .filter((value, index, array) => array.indexOf(value) === index)
          .join(', ');
      }

      async function reverseGeocodeProviders(lat, lng) {
        let lastError = null;
        try {
          const url = new URL('https://photon.komoot.io/reverse');
          url.searchParams.set('lat', lat);
          url.searchParams.set('lon', lng);
          url.searchParams.set('limit', '1');
          const feature = (await fetchJson(url))?.features?.[0];
          const label = feature && photonLabel(feature.properties);
          if (label) return { label, provider: 'Photon / OpenStreetMap' };
        } catch (error) { lastError = error; }

        try {
          const url = new URL('https://nominatim.openstreetmap.org/reverse');
          url.searchParams.set('format', 'jsonv2');
          url.searchParams.set('lat', lat);
          url.searchParams.set('lon', lng);
          url.searchParams.set('zoom', '18');
          url.searchParams.set('addressdetails', '1');
          const result = await fetchJson(url);
          if (result?.display_name) return { label: result.display_name, provider: 'Nominatim / OpenStreetMap' };
        } catch (error) { lastError = error; }

        throw lastError || new Error('Geen adres gevonden');
      }

      async function reverseGeocode(lat, lng, force = false) {
        if (!validCoords(lat, lng)) { toast('Voer geldige coördinaten in.'); return; }

        const changed = !lastResolvedCoords ||
          Math.abs(lastResolvedCoords.lat - lat) > 0.000001 ||
          Math.abs(lastResolvedCoords.lng - lng) > 0.000001;
        if (!force && els.address.value.trim() && changed &&
            !confirm('De coördinaten zijn gewijzigd. Het bestaande adres vervangen?')) return;

        els.resolveBtn.disabled = true;
        els.resolveBtn.textContent = '…';
        try {
          const resolved = await reverseGeocodeProviders(lat, lng);
          els.address.value = resolved.label || '';
          lastResolvedCoords = { lat, lng };
          toast(resolved.label ? `Adres bepaald via ${resolved.provider}.` : 'Geen adres gevonden.');
        } catch {
          toast('Adres bepalen mislukt. Controleer je internetverbinding.');
        } finally {
          els.resolveBtn.disabled = false;
          els.resolveBtn.textContent = '↻';
        }
      }

      els.resolveBtn.addEventListener('click', () => {
        const { lat, lng } = readCoords();
        void reverseGeocode(lat, lng, true);
      });

      /* ------------------------------------------------------------------ *
       * Coordinate parsing
       * ------------------------------------------------------------------ */
      function normalizeCoordinatePair(first, second, orderHint = '') {
        const a = Number(String(first).replace(',', '.'));
        const b = Number(String(second).replace(',', '.'));
        if (!Number.isFinite(a) || !Number.isFinite(b)) return null;

        const asLatLng = validCoords(a, b) ? { lat: a, lng: b } : null;
        const asLngLat = validCoords(b, a) ? { lat: b, lng: a } : null;
        if (orderHint === 'lnglat') return asLngLat;
        if (Math.abs(a) > 90 && Math.abs(b) <= 90) return asLngLat;
        if (!asLatLng) return asLngLat;
        if (!asLngLat) return asLatLng;

        // Both orders are valid: pick the one closest to where the user is.
        const reference = lastKnownPosition || modalMap?.getCenter() || map.getCenter();
        if (!reference) return asLatLng;
        return distanceMetres(reference, asLngLat) < distanceMetres(reference, asLatLng) ? asLngLat : asLatLng;
      }

      function dmsToDecimal(degrees, minutes = 0, seconds = 0, direction = '') {
        let value = Number(degrees) + Number(minutes || 0) / 60 + Number(String(seconds || 0).replace(',', '.')) / 3600;
        if (/^[SW]$/i.test(direction)) value *= -1;
        return value;
      }

      function parseCoordinateText(raw) {
        if (!raw) return null;
        let text = String(raw).trim().replace(/[−–—]/g, '-');
        try { text = decodeURIComponent(text); } catch {}

        const googleBang = text.match(/!3d(-?\d+(?:[.,]\d+)?)!4d(-?\d+(?:[.,]\d+)?)/i);
        if (googleBang) return normalizeCoordinatePair(googleBang[1], googleBang[2]);

        const labelledLatLng = text.match(/(?:lat(?:itude)?)[^\d+-]*([+-]?\d+(?:[.,]\d+)?).*?(?:lon(?:gitude)?|lng)[^\d+-]*([+-]?\d+(?:[.,]\d+)?)/i);
        if (labelledLatLng) return normalizeCoordinatePair(labelledLatLng[1], labelledLatLng[2]);

        const labelledLngLat = text.match(/(?:lon(?:gitude)?|lng)[^\d+-]*([+-]?\d+(?:[.,]\d+)?).*?(?:lat(?:itude)?)[^\d+-]*([+-]?\d+(?:[.,]\d+)?)/i);
        if (labelledLngLat) return normalizeCoordinatePair(labelledLngLat[1], labelledLngLat[2], 'lnglat');

        const urlPair = text.match(/(?:@|[?&](?:q|query|ll|destination)=|geo:)(-?\d+(?:[.,]\d+)?)[,\s]+(-?\d+(?:[.,]\d+)?)/i);
        if (urlPair) return normalizeCoordinatePair(urlPair[1], urlPair[2]);

        const dmsMatches = [...text.matchAll(/(\d{1,3})\s*[°º]\s*(?:(\d{1,2})\s*['’′])?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*["”″])?\s*([NSEW])/gi)];
        if (dmsMatches.length >= 2) {
          const values = dmsMatches.slice(0, 2).map(m => ({
            value: dmsToDecimal(m[1], m[2], m[3], m[4]),
            direction: m[4].toUpperCase()
          }));
          const latPart = values.find(v => /[NS]/.test(v.direction));
          const lngPart = values.find(v => /[EW]/.test(v.direction));
          if (latPart && lngPart && validCoords(latPart.value, lngPart.value)) {
            return { lat: latPart.value, lng: lngPart.value };
          }
        }

        const europeanPair = text.match(/([+-]?\d{1,2},\d+)\s*[;\s]\s*([+-]?\d{1,3},\d+)/);
        if (europeanPair) return normalizeCoordinatePair(europeanPair[1], europeanPair[2]);

        for (const pattern of [
          /([+-]?\d{1,3}(?:\.\d+)?)\s*[,;]\s*([+-]?\d{1,3}(?:\.\d+)?)/,
          /([+-]?\d{1,3}(?:[.,]\d+)?)\s+([+-]?\d{1,3}(?:[.,]\d+)?)/,
          /([+-]?\d{1,3}(?:\.\d+)?)\/([+-]?\d{1,3}(?:\.\d+)?)/
        ]) {
          const match = text.match(pattern);
          const pair = match && normalizeCoordinatePair(match[1], match[2]);
          if (pair) return pair;
        }
        return null;
      }

      async function applyCoordinatePair(pair, resolve = true) {
        if (!pair || !validCoords(pair.lat, pair.lng)) {
          toast('Geen geldige latitude/longitude gevonden.');
          return false;
        }
        pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs);
        setCoords(pair.lat, pair.lng);
        if (modalMapMarker) modalMapMarker.setLatLng([pair.lat, pair.lng]);
        else createDraftMarker(pair.lat, pair.lng);
        modalMap?.setView([pair.lat, pair.lng], 17);
        if (resolve) await reverseGeocode(pair.lat, pair.lng, false);
        return true;
      }

      els.coordApplyBtn.addEventListener('click', () => void applyCoordinatePair(readCoords(), true));

      els.coordPasteBtn.addEventListener('click', async () => {
        let input = '';
        try {
          if (navigator.clipboard?.readText) input = await navigator.clipboard.readText();
        } catch { input = ''; }

        const tryPlace = async (value) => {
          if (!value || (!extractPlusCode(value) && !extractWhat3Words(value))) return false;
          els.placeSearch.value = value;
          await searchPlace();
          return true;
        };

        let pair = parseCoordinateText(input);
        if (!pair && await tryPlace(input)) return;

        if (!pair) {
          input = prompt(
            'Plak coördinaten, een Google Maps-link, Plus Code of ///what3words.\nVoorbeelden:\n52.3676, 4.9041\n8FJG+5F Gerpinnes\n///filled.count.soap',
            input || ''
          ) || '';
          pair = parseCoordinateText(input);
          if (!pair && await tryPlace(input)) return;
        }

        if (!pair) { toast('Geen herkenbare locatie gevonden.'); return; }
        await applyCoordinatePair(pair, true);
      });

      /* ------------------------------------------------------------------ *
       * Place search (address / Plus Code / what3words)
       * ------------------------------------------------------------------ */
      function hideSearchResults() {
        els.searchResults.hidden = true;
        els.searchResults.replaceChildren();
        els.searchStatus.hidden = true;
        els.searchStatus.textContent = '';
      }

      function showSearchStatus(text) {
        els.searchStatus.textContent = text;
        els.searchStatus.hidden = !text;
      }

      function deduplicateSearchResults(results) {
        const seen = new Set();
        return results.reduce((accumulator, result) => {
          const normalized = {
            lat: Number(result.lat),
            lng: Number(result.lng),
            label: String(result.label || '').trim(),
            provider: result.provider || ''
          };
          if (!validCoords(normalized.lat, normalized.lng)) return accumulator;
          const key = `${normalized.lat.toFixed(5)},${normalized.lng.toFixed(5)}`;
          if (seen.has(key)) return accumulator;
          seen.add(key);
          accumulator.push(normalized);
          return accumulator;
        }, []);
      }

      async function searchAddressProviders(query, limit = CONFIG.geocoding.searchLimit) {
        const results = [];
        const locale = (navigator.language || 'en').split('-')[0];

        try {
          const url = new URL('https://photon.komoot.io/api/');
          url.searchParams.set('q', query);
          url.searchParams.set('limit', String(limit));
          url.searchParams.set('lang', locale);
          if (lastKnownPosition) {
            url.searchParams.set('lat', lastKnownPosition.lat);
            url.searchParams.set('lon', lastKnownPosition.lng);
          }
          for (const feature of (await fetchJson(url))?.features || []) {
            const coordinates = feature.geometry?.coordinates;
            if (!Array.isArray(coordinates)) continue;
            results.push({
              lat: coordinates[1],
              lng: coordinates[0],
              label: photonLabel(feature.properties),
              provider: 'Photon / OpenStreetMap'
            });
          }
        } catch {
          // Fall through to Nominatim.
        }

        if (results.length < limit) {
          try {
            const url = new URL('https://nominatim.openstreetmap.org/search');
            url.searchParams.set('format', 'jsonv2');
            url.searchParams.set('q', query);
            url.searchParams.set('limit', String(limit));
            url.searchParams.set('addressdetails', '1');
            url.searchParams.set('accept-language', navigator.language || 'en');
            const data = await fetchJson(url);
            for (const result of Array.isArray(data) ? data : []) {
              results.push({ lat: result.lat, lng: result.lon, label: result.display_name, provider: 'Nominatim / OpenStreetMap' });
            }
          } catch {
            // Offline or blocked: handled by the caller.
          }
        }
        return deduplicateSearchResults(results).slice(0, limit);
      }

      function extractPlusCode(query) {
        const match = String(query).trim().toUpperCase().match(
          /^([23456789CFGHJMPQRVWX0]{2,8}\+[23456789CFGHJMPQRVWX]{2,7})\s*[,;]?\s*(.*)$/i
        );
        return match ? { code: match[1], locality: match[2].trim() } : null;
      }

      async function resolvePlusCode(query) {
        const parsed = extractPlusCode(query);
        if (!parsed) return null;
        if (!window.OpenLocationCode) throw new Error('Plus Code-bibliotheek niet beschikbaar');

        let fullCode = parsed.code;
        if (parsed.code.indexOf('+') < 8) {
          let reference = parsed.locality ? (await searchAddressProviders(parsed.locality, 1))[0] : null;
          reference ||= lastKnownPosition || modalMap?.getCenter() || map.getCenter();
          if (!reference) throw new Error('Korte Plus Code heeft een plaatsnaam of referentiepositie nodig');
          fullCode = OpenLocationCode.recoverNearest(parsed.code, Number(reference.lat), Number(reference.lng));
        }

        const area = OpenLocationCode.decode(fullCode);
        return {
          lat: area.latitudeCenter,
          lng: area.longitudeCenter,
          label: [parsed.code, parsed.locality].filter(Boolean).join(' '),
          provider: 'Open Location Code'
        };
      }

      function extractWhat3Words(query) {
        let value = String(query || '').trim();
        try {
          if (/^https?:\/\//i.test(value)) {
            const url = new URL(value);
            if (/what3words|w3w\.co/i.test(url.hostname)) value = url.pathname.replace(/^\/+/, '');
          }
        } catch {}
        value = value.replace(/^\/{3}/, '').split(/[?#]/)[0].trim();
        const dot = '[.。｡・･︒։၊۔።।]';
        const match = value.match(new RegExp(`^([^\\s/]+)${dot}([^\\s/]+)${dot}([^\\s/]+)$`, 'u'));
        return match ? `${match[1]}.${match[2]}.${match[3]}` : null;
      }

      function getWhat3WordsApiKey() {
        let key = localStorage.getItem(W3W_API_KEY_KEY) || '';
        if (!key) {
          key = prompt('what3words vereist een API-key. Plak je what3words Public API-key. Die blijft alleen lokaal in deze browser.', '')?.trim() || '';
          if (key) { try { localStorage.setItem(W3W_API_KEY_KEY, key); } catch {} }
        }
        return key;
      }

      async function resolveWhat3Words(words) {
        const key = getWhat3WordsApiKey();
        if (!key) throw new Error('what3words API-key ontbreekt');

        const url = new URL('https://api.what3words.com/v3/convert-to-coordinates');
        url.searchParams.set('key', key);
        url.searchParams.set('words', words);
        url.searchParams.set('format', 'json');
        try {
          const data = await fetchJson(url);
          if (!data?.coordinates) throw new Error(data?.error?.message || 'Geen what3words-resultaat');
          return {
            lat: Number(data.coordinates.lat),
            lng: Number(data.coordinates.lng),
            label: `///${data.words}${data.nearestPlace ? ` — ${data.nearestPlace}` : ''}`,
            provider: 'what3words'
          };
        } catch (error) {
          if (/401|403|key|authentication/i.test(String(error?.message || ''))) {
            localStorage.removeItem(W3W_API_KEY_KEY);
          }
          throw error;
        }
      }

      async function applySearchResult(result) {
        const pair = { lat: Number(result.lat), lng: Number(result.lng) };
        pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs * 1.5);
        setCoords(pair.lat, pair.lng);
        if (modalMapMarker) modalMapMarker.setLatLng([pair.lat, pair.lng]);
        else createDraftMarker(pair.lat, pair.lng);
        modalMap?.setView([pair.lat, pair.lng], 17);
        els.address.value = result.label || '';
        lastResolvedCoords = pair;
        hideSearchResults();
        toast(`Locatie toegepast${result.provider ? ` via ${result.provider}` : ''}.`);
      }

      function renderSearchResults(results) {
        els.searchResults.replaceChildren();
        for (const result of results) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'search-result';
          button.innerHTML = `<strong>${escapeHtml(result.label || `${result.lat}, ${result.lng}`)}</strong>` +
            (result.provider ? `<br><small>${escapeHtml(result.provider)}</small>` : '');
          button.addEventListener('click', () => applySearchResult(result));
          els.searchResults.appendChild(button);
        }
        els.searchResults.hidden = false;
        showSearchStatus(`${results.length} resultaat${results.length === 1 ? '' : 'en'}. Tik om toe te passen.`);
      }

      async function searchPlace() {
        const query = els.placeSearch.value.trim();
        if (!query) { els.placeSearch.focus(); return; }

        pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs * 1.5);
        els.placeSearchBtn.disabled = true;
        els.placeSearchBtn.textContent = '…';
        hideSearchResults();

        try {
          const coordinates = parseCoordinateText(query);
          if (coordinates) {
            await applySearchResult({ ...coordinates, label: query, provider: 'Coördinaten' });
            await reverseGeocode(coordinates.lat, coordinates.lng, true);
            return;
          }

          if (extractPlusCode(query)) {
            const result = await resolvePlusCode(query);
            await applySearchResult(result);
            try { await reverseGeocode(result.lat, result.lng, true); } catch {}
            return;
          }

          const what3words = extractWhat3Words(query);
          if (what3words) {
            await applySearchResult(await resolveWhat3Words(what3words));
            return;
          }

          const results = await searchAddressProviders(query, CONFIG.geocoding.searchLimit);
          if (!results.length) {
            showSearchStatus('Geen resultaat. Photon en Nominatim zijn geprobeerd.');
            toast('Geen locatie gevonden.');
            return;
          }
          renderSearchResults(results);
        } catch (error) {
          const message = String(error?.message || 'Zoeken mislukt');
          showSearchStatus(message);
          toast(message);
        } finally {
          els.placeSearchBtn.disabled = false;
          els.placeSearchBtn.textContent = '\u{1F50E}';
        }
      }

      els.placeSearchBtn.addEventListener('click', () => void searchPlace());
      els.placeSearch.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        void searchPlace();
      });

      function coordinateFieldChanged() {
        clearTimeout(coordinateChangeTimer);
        coordinateChangeTimer = setTimeout(async () => {
          const { lat, lng } = readCoords();
          if (!validCoords(lat, lng)) return;
          modalMapMarker?.setLatLng([lat, lng]);
          modalMap?.panTo([lat, lng]);
          await reverseGeocode(lat, lng, false);
        }, CONFIG.geocoding.coordinateDebounceMs);
      }
      els.lat.addEventListener('change', coordinateFieldChanged);
      els.lng.addEventListener('change', coordinateFieldChanged);

      function useCurrentLocationInModal() {
        pauseAutoFollow(CONFIG.map.autoFollowLongPauseMs);
        if (!navigator.geolocation) { toast('Locatiebepaling is niet beschikbaar.'); return; }
        els.modalLocateBtn.disabled = true;
        navigator.geolocation.getCurrentPosition(async position => {
          els.modalLocateBtn.disabled = false;
          const { latitude: lat, longitude: lng, accuracy } = position.coords;
          lastKnownPosition = { lat, lng, accuracy, time: Date.now() };
          setCoords(lat, lng);
          if (modalMapMarker) modalMapMarker.setLatLng([lat, lng]); else createDraftMarker(lat, lng);
          modalMap?.setView([lat, lng], 17);
          await reverseGeocode(lat, lng, false);
        }, () => {
          els.modalLocateBtn.disabled = false;
          toast('Huidige locatie kon niet worden opgehaald.');
        }, { enableHighAccuracy: true, timeout: CONFIG.map.locateTimeoutMs, maximumAge: 0 });
      }
      els.modalLocateBtn.addEventListener('click', useCurrentLocationInModal);

      /* ------------------------------------------------------------------ *
       * Sharing
       * ------------------------------------------------------------------ */
      // Commas and pipes are legal in a query value, and Google's URL scheme
      // expects them raw, so these are built by hand rather than with
      // URLSearchParams (which would percent-encode them into noise).
      const googleMapsUrl = (lat, lng) => `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

      function googleDirectionsUrl(points) {
        const coords = points.map(point => `${point.lat},${point.lng}`);
        const middle = coords.slice(1, -1);
        return 'https://www.google.com/maps/dir/?api=1' +
          `&origin=${coords[0]}&destination=${coords[coords.length - 1]}` +
          (middle.length ? `&waypoints=${middle.join('|')}` : '');
      }

      async function shareText(title, text) {
        try {
          if (navigator.share) return await navigator.share({ title, text });
          await navigator.clipboard.writeText(text);
          toast('Deeltekst gekopieerd.');
        } catch (error) {
          if (error?.name !== 'AbortError') prompt('Kopieer deze tekst:', text);
        }
      }

      function waypointShareText() {
        const { lat, lng } = readCoords();
        const visits = sortOccasions(readOccasionRows().filter(occasion => occasion.startAt));
        const visitLines = visits.length > 1
          ? ['Bezoeken:', ...visits.map((occasion, index) => `${index + 1}. ${occasionText(occasion)}`)]
          : visits.map(occasion => [
              `Start: ${formatDateTime(occasion.startAt)}`,
              occasion.endAt ? `Einde: ${formatDateTime(occasion.endAt)}` : ''
            ].filter(Boolean).join('\n'));

        return [
          els.title.value.trim() || 'Waypoint',
          ...visitLines,
          els.address.value.trim(),
          els.note.value.trim(),
          validCoords(lat, lng) ? `Google Maps: ${googleMapsUrl(lat, lng)}` : ''
        ].filter(Boolean).join('\n');
      }

      function trackShareText() {
        const track = findItem(els.trackId.value);
        const stats = track ? trackStats(track) : { distance: 0, durationMs: 0, points: 0, gaps: 0 };
        const first = track?.points?.[0];
        const last = track?.points?.at(-1);
        return [
          els.trackTitle.value.trim() || 'Track',
          els.trackStartAt.value ? `Start: ${formatDateTime(els.trackStartAt.value)}` : '',
          els.trackEndAt.value ? `Einde: ${formatDateTime(els.trackEndAt.value)}` : '',
          `Afstand: ${formatDistance(stats.distance)}`,
          `Duur: ${formatDuration(stats.durationMs)}`,
          `GPS-punten: ${stats.points}${stats.gaps ? `, onderbrekingen: ${stats.gaps}` : ''}`,
          els.trackNote.value.trim(),
          first ? `Startkaart: ${googleMapsUrl(first.lat, first.lng)}` : '',
          last ? `Eindkaart: ${googleMapsUrl(last.lat, last.lng)}` : ''
        ].filter(Boolean).join('\n');
      }

      // Google's documented Maps URL scheme: on iOS this hands off to the
      // Google Maps app when it is installed, otherwise it opens the web map.
      els.waypointMapsBtn.addEventListener('click', () => {
        const { lat, lng } = readCoords();
        if (!validCoords(lat, lng)) { toast('Voer eerst geldige coördinaten in.'); return; }
        const url = googleMapsUrl(lat, lng);
        if (window.open(url, '_blank', 'noopener')) return;
        // Standalone home-screen apps can block window.open; a synthetic link
        // still opens Safari and leaves this app running in the background.
        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
      });

      /* ------------------------------------------------------------------ *
       * Sharing a selection: text card + a rendered PNG of the map
       * ------------------------------------------------------------------ */
      function selectedItems() {
        return [...selection].map(findItem).filter(Boolean)
          .sort((a, b) => itemMoment(a).localeCompare(itemMoment(b)));
      }

      function itemShareBlock(item, index) {
        const lines = [`${index + 1}. ${item.title}${item.category ? ` [${item.category}]` : ''}`];
        if (itemGroup(item)) lines.push(`   Groep: ${itemGroup(item)}`);
        if (isTrack(item)) {
          const stats = trackStats(item);
          lines.push(`   ${formatRange(item.startAt, item.endAt)}`);
          lines.push(`   ${formatDistance(stats.distance)} · ${formatDuration(stats.durationMs)} · ${stats.points} punten`);
          const first = item.points?.[0];
          if (first) lines.push(`   ${googleMapsUrl(first.lat, first.lng)}`);
        } else {
          for (const occasion of sortOccasions(itemOccasions(item))) lines.push(`   ${occasionText(occasion)}`);
          if (item.address) lines.push(`   ${item.address}`);
          lines.push(`   ${googleMapsUrl(item.lat, item.lng)}`);
        }
        if (item.note) lines.push(`   ${item.note}`);
        return lines.join('\n');
      }

      function selectionShareText(list) {
        const waypoints = list.filter(item => !isTrack(item));
        const header = list.length === 1 ? list[0].title : `${list.length} locaties`;
        const blocks = list.map(itemShareBlock);

        // A single directions link that strings the whole selection together.
        const route = waypoints.length > 1
          ? `Route langs alle punten:\n${googleDirectionsUrl(waypoints)}`
          : '';
        return [header, '', blocks.join('\n\n'), route].filter(Boolean).join('\n');
      }

      /* --- static PNG of the map for the current selection --- */
      function loadImage(src) {
        return new Promise(resolve => {
          const image = new Image();
          image.crossOrigin = 'anonymous';
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = src;
          setTimeout(() => resolve(image.complete ? image : null), CONFIG.export.tileTimeoutMs);
        });
      }

      function tileUrl(config, z, x, y) {
        const subs = config.subdomains || '';
        return config.url
          .replace('{s}', subs ? subs[Math.abs(x + y) % subs.length] : '')
          .replace('{z}', z)
          .replace('{x}', x)
          .replace('{y}', y)
          .replace('{r}', '');
      }

      /* ------------------------------------------------------------------ *
       * Label placement
       *
       * Placing point labels without overlap is NP-hard, so this uses the
       * standard heuristic. Each label gets a fixed set of candidate slots
       * around its pin. Cost of a slot = overlapping area with pins (weighted
       * heavier, since covering a pin is worse than clipping a label), with
       * labels already placed, and with the area falling outside the canvas.
       * Labels are assigned greedily most-constrained-first, then a few
       * local-search passes re-place one label at a time against the others,
       * which is what actually clears the clusters.
       * ------------------------------------------------------------------ */
      const boxOverlap = (a, b) =>
        Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) *
        Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));

      const pinObstacles = (anchors, widths = []) =>
        anchors.map((point, index) => {
          const half = Math.max(16, (widths[index] || 0) / 2 + 2);
          return { x: point.x - half, y: point.y - 46, w: half * 2, h: 48 };
        });

      function labelCandidates(anchor, w, h) {
        return [
          { x: anchor.x - w / 2, y: anchor.y + 6 },            // under the tip
          { x: anchor.x + 17, y: anchor.y - 36 - h / 2 },      // right of the head
          { x: anchor.x - 17 - w, y: anchor.y - 36 - h / 2 },  // left of the head
          { x: anchor.x - w / 2, y: anchor.y - 50 - h },       // above the head
          { x: anchor.x + 12, y: anchor.y + 4 },
          { x: anchor.x - 12 - w, y: anchor.y + 4 },
          { x: anchor.x + 12, y: anchor.y - 50 - h },
          { x: anchor.x - 12 - w, y: anchor.y - 50 - h },
          { x: anchor.x - w / 2, y: anchor.y + 10 + h },       // second row down
          { x: anchor.x - w / 2, y: anchor.y - 56 - 2 * h }    // second row up
        ];
      }

      function layoutLabels(boxes, obstacles, bounds) {
        const slots = boxes.map(box => labelCandidates(box.anchor, box.w, box.h));
        const placed = boxes.map(() => null);

        const outside = (rect) => {
          const inside = boxOverlap(rect, bounds);
          return rect.w * rect.h - inside;
        };

        const cost = (index, slot) => {
          const box = boxes[index];
          const rect = { x: slot.x, y: slot.y, w: box.w, h: box.h };
          let total = outside(rect) * CONFIG.export.outsideWeight;
          for (const obstacle of obstacles) total += boxOverlap(rect, obstacle) * CONFIG.export.obstacleWeight;
          for (let other = 0; other < boxes.length; other++) {
            if (other === index || !placed[other]) continue;
            total += boxOverlap(rect, { ...placed[other], w: boxes[other].w, h: boxes[other].h });
          }
          return total;
        };

        // Most constrained first: fewest slots that clear the pins outright.
        const order = boxes.map((box, index) => {
          const free = slots[index].filter(slot => {
            const rect = { x: slot.x, y: slot.y, w: box.w, h: box.h };
            return obstacles.every(obstacle => boxOverlap(rect, obstacle) === 0) && outside(rect) === 0;
          }).length;
          return { index, free, y: box.anchor.y };
        }).sort((a, b) => a.free - b.free || a.y - b.y);

        const bestSlot = (index) => {
          let best = null;
          let bestCost = Infinity;
          slots[index].forEach((slot, rank) => {
            const value = cost(index, slot) + rank * CONFIG.export.slotPenalty;   // ties prefer the canonical slot
            if (value < bestCost) { bestCost = value; best = slot; }
          });
          return { slot: best, cost: bestCost };
        };

        for (const { index } of order) placed[index] = bestSlot(index).slot;

        // Local search: re-place each label knowing where the others ended up.
        for (let pass = 0; pass < CONFIG.export.searchPasses; pass++) {
          let improved = false;
          for (const { index } of order) {
            const current = placed[index];
            placed[index] = null;
            const { slot } = bestSlot(index);
            placed[index] = slot;
            if (slot !== current) improved = true;
          }
          if (!improved) break;
        }

        // Anything still badly buried is dropped; the numbered pin identifies
        // it and the shared text lists the same numbers.
        return placed.map((slot, index) => {
          if (!slot) return null;
          placed[index] = null;
          const residual = cost(index, slot);
          placed[index] = slot;
          const area = boxes[index].w * boxes[index].h;
          return residual > area * CONFIG.export.labelDropRatio ? null : slot;
        });
      }

      function zoomForBounds(bounds, width, height, padding) {
        const crs = map.options.crs;
        for (let zoom = 18; zoom > 1; zoom--) {
          const nw = crs.latLngToPoint(bounds.getNorthWest(), zoom);
          const se = crs.latLngToPoint(bounds.getSouthEast(), zoom);
          if (se.x - nw.x <= width - padding * 2 && se.y - nw.y <= height - padding * 2) return zoom;
        }
        return 2;
      }

      async function renderSelectionPng(list) {
        const bounds = selectionBounds();
        if (!bounds) return null;

        const size = CONFIG.export.size;
        const padding = CONFIG.export.padding;
        const crs = map.options.crs;
        const zoom = bounds.getNorthEast().equals(bounds.getSouthWest())
          ? Math.min(16, map.getZoom())
          : zoomForBounds(bounds, size, size, padding);
        const centre = crs.latLngToPoint(bounds.getCenter(), zoom);
        const origin = centre.subtract([size / 2, size / 2]);
        const project = (lat, lng) => crs.latLngToPoint(L.latLng(lat, lng), zoom).subtract(origin);

        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#dcdce1';
        ctx.fillRect(0, 0, size, size);

        // Tiles come from the chosen basemap. crossOrigin is set and every
        // source sends CORS headers, so the canvas stays exportable.
        const config = basemap();
        const tileSize = CONFIG.export.tileSize;
        const count = Math.pow(2, zoom);
        const jobs = [];
        for (let x = Math.floor(origin.x / tileSize); x <= Math.floor((origin.x + size) / tileSize); x++) {
          for (let y = Math.floor(origin.y / tileSize); y <= Math.floor((origin.y + size) / tileSize); y++) {
            if (y < 0 || y >= count) continue;
            const wrappedX = ((x % count) + count) % count;
            const url = tileUrl(config, zoom, wrappedX, y);
            jobs.push(loadImage(url).then(image => ({ image, dx: x * tileSize - origin.x, dy: y * tileSize - origin.y })));
          }
        }
        for (const { image, dx, dy } of await Promise.all(jobs)) {
          if (image) ctx.drawImage(image, dx, dy, tileSize, tileSize);
        }

        // Group connectors, then tracks, then pins on top.
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const section of groupedSections()) {
          if (!section.name) continue;
          const members = section.items.filter(item => !isTrack(item) && isSelected(item.id));
          if (members.length < 2) continue;
          ctx.save();
          ctx.setLineDash([3, 10]);
          ctx.strokeStyle = groupColor(section.name);
          ctx.lineWidth = 3;
          ctx.beginPath();
          members.forEach((item, index) => {
            const point = project(item.lat, item.lng);
            index ? ctx.lineTo(point.x, point.y) : ctx.moveTo(point.x, point.y);
          });
          ctx.stroke();
          ctx.restore();
        }

        for (const item of list.filter(isTrack)) {
          ctx.strokeStyle = '#0a84ff';
          ctx.lineWidth = 5;
          for (const segment of splitTrackSegments(item)) {
            if (segment.length < 2) continue;
            ctx.beginPath();
            segment.forEach(([lat, lng], index) => {
              const point = project(lat, lng);
              index ? ctx.lineTo(point.x, point.y) : ctx.moveTo(point.x, point.y);
            });
            ctx.stroke();
          }
        }

        const waypoints = list.filter(item => !isTrack(item));
        const anchors = waypoints.map(item => project(item.lat, item.lng));

        // Pins first, so no label can be hidden underneath one.
        const badgeWidths = [];
        anchors.forEach((point, index) => {
          const { emoji } = leadingEmoji(waypoints[index].title);
          if (emoji) {
            // Emoji chip with the sequence number as a small badge, so the
            // image still matches the numbered list in the shared text.
            ctx.font = '22px -apple-system, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
            const glyph = Math.ceil(ctx.measureText(emoji).width);
            const half = Math.max(17, glyph / 2 + 7);
            badgeWidths[index] = half * 2;   // label placement must clear it
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(point.x - half, point.y - 37, half * 2, 34, 17);
            else ctx.arc(point.x, point.y - 20, 17, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#0a84ff';
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(point.x, point.y);
            ctx.lineTo(point.x - 6, point.y - 12);
            ctx.lineTo(point.x + 6, point.y - 12);
            ctx.closePath();
            ctx.fillStyle = '#0a84ff';
            ctx.fill();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, point.x, point.y - 19);
            ctx.beginPath();
            ctx.arc(point.x + half - 3, point.y - 34, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#0a84ff';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px -apple-system, system-ui, sans-serif';
            ctx.fillText(String(index + 1), point.x + half - 3, point.y - 33);
            return;
          }
          // Two passes: a white silhouette first, then the blue body on top.
          // Stroking the two subpaths directly would draw an outline straight
          // across the seam where the head meets the stem.
          const pin = (fill, halo) => {
            ctx.fillStyle = fill;
            ctx.strokeStyle = fill;
            ctx.lineWidth = halo;
            ctx.beginPath();
            ctx.moveTo(point.x, point.y);
            ctx.lineTo(point.x - 9, point.y - 22);
            ctx.lineTo(point.x + 9, point.y - 22);
            ctx.closePath();
            if (halo) ctx.stroke();
            ctx.fill();
            ctx.beginPath();
            ctx.arc(point.x, point.y - 28, 13, 0, Math.PI * 2);
            if (halo) ctx.stroke();
            ctx.fill();
          };
          pin('#ffffff', 7);
          pin('#0a84ff', 0);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 15px -apple-system, system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(index + 1), point.x, point.y - 27);
        });

        // Labels are placed by search, not by a fixed offset.
        const dense = waypoints.length > CONFIG.export.denseThreshold;
        const fontSize = dense ? CONFIG.export.labelFontSizeDense : CONFIG.export.labelFontSize;
        const maxChars = dense ? CONFIG.export.labelMaxCharsDense : CONFIG.export.labelMaxChars;
        ctx.font = `bold ${fontSize}px -apple-system, system-ui, sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        const padX = 5;
        const padY = 3;
        const boxes = waypoints.map((item, index) => {
          const full = leadingEmoji(item.title).emoji ? titleWithoutIcon(item) : item.title;
          const text = full.length > maxChars ? full.slice(0, maxChars - 1) + '…' : full;
          return {
            text,
            anchor: anchors[index],
            w: Math.ceil(ctx.measureText(text).width) + padX * 2,
            h: fontSize + padY * 2 + 2
          };
        });

        const placements = layoutLabels(boxes, pinObstacles(anchors, badgeWidths), { x: 4, y: 4, w: size - 8, h: size - 34 });

        placements.forEach((place, index) => {
          if (!place) return;   // no readable slot: the numbered pin still identifies it
          const box = boxes[index];
          ctx.fillStyle = 'rgba(255,255,255,.86)';
          ctx.strokeStyle = 'rgba(0,0,0,.10)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(place.x, place.y, box.w, box.h, 5);
          else ctx.rect(place.x, place.y, box.w, box.h);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#111114';
          ctx.fillText(box.text, place.x + padX, place.y + padY + 1);
        });

        // OpenStreetMap requires visible attribution on exported maps.
        ctx.font = '13px -apple-system, system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        const credit = basemap().credit;
        const width = ctx.measureText(credit).width;
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.fillRect(size - width - 14, size - 26, width + 14, 26);
        ctx.fillStyle = '#333';
        ctx.fillText(credit, size - 7, size - 6);

        try {
          return await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        } catch {
          return null;   // tainted canvas: tiles were served without CORS
        }
      }

      function chooseAction(title, hint, options) {
        return new Promise(resolve => {
          els.chooseTitle.textContent = title;
          els.chooseHint.textContent = hint || '';
          els.chooseHint.hidden = !hint;
          els.chooseOptions.replaceChildren(...options.map(option => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn' + (option.primary ? ' primary' : '');
            button.innerHTML = `${escapeHtml(option.label)}${option.detail ? `<small>${escapeHtml(option.detail)}</small>` : ''}`;
            button.addEventListener('click', () => { close(option.value); });
            return button;
          }));

          const close = (value) => {
            els.chooseModal.classList.remove('open');
            syncModalVisibleClass();
            els.chooseCloseBtn.onclick = null;
            els.chooseModal.onclick = null;
            resolve(value);
          };
          els.chooseCloseBtn.onclick = () => close(null);
          els.chooseModal.onclick = (event) => { if (event.target === els.chooseModal) close(null); };
          els.chooseModal.classList.add('open');
          document.body.classList.add('modal-visible');
        });
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }

      async function shareSelection() {
        const list = selectedItems();
        if (!list.length) { toast('Selecteer eerst één of meer items.'); return; }

        const text = selectionShareText(list);
        const title = list.length === 1 ? list[0].title : `${list.length} locaties`;
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');

        els.shareSelBtn.disabled = true;
        try {
          const blob = await renderSelectionPng(list);
          const file = blob ? new File([blob], `kaart-${stamp}.png`, { type: 'image/png' }) : null;

          // Preferred path: one share sheet carrying both the card text and
          // the map image.
          if (file && navigator.canShare?.({ files: [file], text, title })) {
            try {
              await navigator.share({ files: [file], text, title });
              return;
            } catch (error) {
              if (error?.name === 'AbortError') return;
              // fall through to the choice below
            }
          }

          const choice = await chooseAction(
            'Delen',
            file
              ? 'Tekst en kaart samen delen kan niet in deze browser. Kies wat je wilt delen.'
              : 'De kaartafbeelding kon niet worden gemaakt. Je kunt de tekst wel delen.',
            [
              { label: 'Deel tekst', detail: `${list.length} kaart${list.length === 1 ? 'je' : 'jes'} met Google Maps-links`, value: 'text', primary: true },
              ...(file ? [{ label: 'Deel kaart (PNG)', detail: 'Afbeelding van de selectie', value: 'png' }] : [])
            ]
          );
          if (!choice) return;

          if (choice === 'text') {
            await shareText(title, text);
            return;
          }

          if (navigator.canShare?.({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title });
              return;
            } catch (error) {
              if (error?.name === 'AbortError') return;
            }
          }
          downloadBlob(blob, file.name);
          toast('Kaart bewaard als PNG.');
        } finally {
          els.shareSelBtn.disabled = false;
        }
      }

      els.shareSelBtn.addEventListener('click', () => void shareSelection());
      els.clearSelBtn.addEventListener('click', clearSelection);

      els.waypointShareBtnBottom.addEventListener('click', () =>
        shareText(els.title.value.trim() || 'Waypoint', waypointShareText()));
      els.trackShareBtn.addEventListener('click', () =>
        shareText(els.trackTitle.value.trim() || 'Track', trackShareText()));

      /* ------------------------------------------------------------------ *
       * Track recording
       * ------------------------------------------------------------------ */
      function updateRecordButton() {
        const recording = Boolean(activeTrack?.active);
        els.recordBtn.classList.toggle('recording', recording);
        const label = recording ? 'Stop en bewaar track' : 'Start trackopname';
        els.recordBtn.setAttribute('aria-label', label);
        els.recordBtn.title = label;
      }

      /* ------------------------------------------------------------------ *
       * Adaptieve bemonstering
       *
       * De drempel volgt de snelheid. Voor lopen tot snelweg blijkt de tabel
       * van de gebruiker één regel te zijn: 5 m bij 5 km/u, 50 m bij 50 km/u
       * en 100 m bij 100 km/u is telkens afstand = snelheid × 3,6 s, dus een
       * punt per ~3,6 seconde afgelegde weg. Vliegen wijkt daar bewust van af
       * (1 km) omdat de lijn dan toch recht is. Daarom is het geen formule
       * maar een tabel met profielen: die houdt beide regimes leesbaar én
       * aanpasbaar in het register.
       *
       * Keuze van het profiel: de gemeten snelheid gaat door een exponentieel
       * voortschrijdend gemiddelde (ruis eruit), en rond elke profielgrens
       * ligt een hysteresemarge zodat het profiel niet heen en weer springt
       * bij bijvoorbeeld 69-71 km/u.
       * ------------------------------------------------------------------ */
      const trackingProfiles = () => CONFIG.tracking.profiles;
      const profileById = (id) => trackingProfiles().find(profile => profile.id === id) || null;

      function profileLowerBound(profile) {
        const list = trackingProfiles();
        const index = list.indexOf(profile);
        return index > 0 ? list[index - 1].maxSpeedKmh : 0;
      }

      function profileForSpeed(speedKmh) {
        const list = trackingProfiles();
        const margin = CONFIG.tracking.hysteresis;
        // Blijf in het huidige profiel zolang de snelheid binnen de marge valt.
        if (trackingProfile && list.includes(trackingProfile)) {
          const upper = trackingProfile.maxSpeedKmh;
          const lower = profileLowerBound(trackingProfile);
          if (speedKmh <= upper * (1 + margin) && speedKmh >= lower * (1 - margin)) return trackingProfile;
        }
        return list.find(profile => speedKmh <= profile.maxSpeedKmh) || list.at(-1);
      }

      // GPS levert vaak zelf een snelheid; zo niet, dan uit de afgelegde weg.
      function measuredSpeedKmh(coords, previous, time) {
        if (Number.isFinite(coords.speed) && coords.speed >= 0) return coords.speed * 3.6;
        if (!previous) return 0;
        const seconds = (new Date(time) - new Date(previous.time)) / 1000;
        if (seconds <= 0) return 0;
        return distanceMetres(previous, { lat: coords.latitude, lng: coords.longitude }) / seconds * 3.6;
      }

      function activeProfile() {
        const mode = activeTrack?.trackingMode || CONFIG.tracking.defaultMode;
        if (mode !== 'auto') return profileById(mode) || trackingProfiles().at(-1);
        return trackingProfile || profileById('stationary') || trackingProfiles()[0];
      }

      function updateTrackingProfile(speedKmh) {
        const alpha = CONFIG.tracking.speedSmoothing;
        smoothedSpeedKmh = alpha * speedKmh + (1 - alpha) * smoothedSpeedKmh;

        const mode = activeTrack?.trackingMode || CONFIG.tracking.defaultMode;
        const chosen = mode === 'auto' ? profileForSpeed(smoothedSpeedKmh) : profileById(mode) || trackingProfiles().at(-1);
        if (chosen === trackingProfile) return false;

        trackingProfile = chosen;
        if (activeTrack) {
          activeTrack.profile = chosen.id;
          activeTrack.events.push({
            time: new Date().toISOString(),
            type: 'profile',
            profile: chosen.id,
            speedKmh: Math.round(smoothedSpeedKmh)
          });
        }
        return true;   // de bemonsteringsfrequentie moet mee veranderen
      }

      /**
       * Beslist of een fix een nieuw trackpunt wordt.
       * Stilstaan is een apart regime: binnen de straal hoogstens één punt per
       * interval, zodat een nacht op een parkeerplaats geen duizend punten
       * oplevert maar wel aantoonbaar doorloopt.
       */
      function acceptsPoint(profile, moved, elapsedMs) {
        if (!Number.isFinite(moved)) return { accept: true, reason: 'first' };
        const cfg = CONFIG.tracking;
        // De straal van 25 m geldt bij stilstaan. Bij lopen is 5 m juist wel
        // een verplaatsing, dus daar mag deze regel niet overheen.
        if (profile.id === 'stationary') {
          if (moved >= cfg.stationaryRadiusM) return { accept: true, reason: 'left-spot' };
          return elapsedMs >= cfg.stationaryMaxIntervalMs
            ? { accept: true, reason: 'stationary-heartbeat' }
            : { accept: false, reason: 'stationary' };
        }
        if (moved >= profile.minMoveM) return { accept: true, reason: 'moved' };
        if (elapsedMs >= profile.maxIntervalMs) return { accept: true, reason: 'heartbeat' };
        return { accept: false, reason: 'below-threshold' };
      }

      function requestTrackPosition() {
        if (!activeTrack?.active || trackingBusy || !navigator.geolocation) return;
        trackingBusy = true;
        const cfg = CONFIG.tracking;
        navigator.geolocation.getCurrentPosition(
          position => {
            trackingBusy = false;
            if (!activeTrack?.active) return;
            const c = position.coords;
            const time = new Date(position.timestamp || Date.now()).toISOString();
            const previous = activeTrack.points.at(-1);
            const elapsed = previous ? new Date(time) - new Date(previous.time) : 0;

            if (Number.isFinite(c.accuracy) && c.accuracy > cfg.maxAccuracyM) {
              activeTrack.pendingGap = true;
              activeTrack.events.push({ time, type: 'poor-accuracy', accuracy: c.accuracy });
              activeTrack.updatedAt = new Date().toISOString();
              saveActiveTrack();
              return;
            }

            const moved = previous ? distanceMetres(previous, { lat: c.latitude, lng: c.longitude }) : Infinity;
            const rescheduled = updateTrackingProfile(measuredSpeedKmh(c, previous, time));
            const profile = activeProfile();
            const verdict = acceptsPoint(profile, moved, elapsed);

            if (rescheduled) startTrackingTimer({ restartOnly: true });

            if (!verdict.accept) {
              activeTrack.events.push({ time, type: verdict.reason, distance: Math.round(moved), profile: profile.id });
              activeTrack.updatedAt = new Date().toISOString();
              saveActiveTrack();
              updateActiveTrackRow();
              return;
            }

            const point = {
              lat: c.latitude,
              lng: c.longitude,
              time,
              accuracy: c.accuracy ?? null,
              altitude: c.altitude ?? null,
              speed: c.speed ?? null,
              heading: c.heading ?? null,
              profile: profile.id,
              breakBefore: Boolean(activeTrack.pendingGap || (previous && elapsed > cfg.gapThresholdMs))
            };
            activeTrack.pendingGap = false;
            activeTrack.points.push(point);
            activeTrack.updatedAt = new Date().toISOString();
            // Eén append voor het punt, één klein record voor de metadata.
            void appendPointToDb(activeTrack.id, point, activeTrack.points.length - 1);
            saveActiveTrack();
            appendActiveTrackPoint(point);
            if (Date.now() >= autoFollowPausedUntil) map.panTo([point.lat, point.lng], { animate: true });
          },
          error => {
            trackingBusy = false;
            if (!activeTrack?.active) return;
            activeTrack.pendingGap = true;
            activeTrack.events.push({ time: new Date().toISOString(), type: 'gps-error', code: error.code, message: error.message });
            saveActiveTrack();
            toast('Geen GPS-fix; de track gaat verder als een nieuw segment.');
          },
          { enableHighAccuracy: true, timeout: cfg.gpsTimeoutMs, maximumAge: cfg.gpsMaximumAgeMs }
        );
      }

      // Het gewenste interval: tijdens de opwarmfase snel, daarna volgens profiel.
      function sampleIntervalMs() {
        const cfg = CONFIG.tracking;
        const started = activeTrack?.startedMs;
        if (started && Date.now() - started < cfg.warmupMs) return cfg.warmupSampleMs;
        return activeProfile().sampleMs;
      }

      function startTrackingTimer({ restartOnly = false } = {}) {
        clearInterval(trackingTimer);
        if (!restartOnly) requestTrackPosition();
        currentIntervalMs = sampleIntervalMs();
        trackingTimer = setInterval(() => {
          // Het einde van de opwarmfase verandert het interval zonder dat er
          // een profielwissel is, dus dat wordt hier opgemerkt.
          if (sampleIntervalMs() !== currentIntervalMs) { startTrackingTimer({ restartOnly: true }); return; }
          requestTrackPosition();
        }, currentIntervalMs);
      }

      function stopTrackingTimer() {
        clearInterval(trackingTimer);
        trackingTimer = null;
        trackingBusy = false;
      }

      function startTrack() {
        if (!navigator.geolocation) { toast('Geolocatie is niet beschikbaar.'); return; }
        const now = new Date();
        activeTrack = {
          id: uuid(),
          type: 'track',
          active: true,
          seq: nextSeq++,
          title: `Track ${dateTimeFormat.format(now)}`,
          note: '',
          category: '',
          group: lastUsedGroup,
          trackingMode: CONFIG.tracking.defaultMode,
          profile: 'stationary',
          startedMs: Date.now(),
          startAt: localDateTimeValue(now),
          endAt: '',
          points: [],
          events: [],
          pendingGap: false,
          createdAt: now.toISOString(),
          updatedAt: now.toISOString()
        };
        trackingProfile = profileById('stationary') || trackingProfiles()[0];
        smoothedSpeedKmh = 0;
        saveActiveTrack();
        syncActiveTrackLayer(true);
        startTrackingTimer();
        render();
        toast('Trackopname gestart.');
      }

      function finalizeTrack() {
        if (!activeTrack) return;
        stopTrackingTimer();
        activeTrack.active = false;
        activeTrack.endAt = localDateTimeValue();
        activeTrack.updatedAt = new Date().toISOString();
        const completed = activeTrack;

        if (!completed.points.length &&
            !confirm('Er zijn geen bruikbare GPS-posities opgenomen. Deze lege track toch bewaren?')) {
          activeTrack = null;
          void removeItemFromDb(completed.id);
          syncActiveTrackLayer();
          render();
          toast('Lege track verwijderd.');
          return;
        }

        activeTrack = null;
        saveActiveTrack();
        syncActiveTrackLayer();
        items.unshift(completed);
        void persistItem(completed);
        selection.clear();
        selection.add(String(completed.id));
        render();
        openTrackModal(completed, true);
      }

      els.recordBtn.addEventListener('click', () => {
        if (activeTrack?.active) finalizeTrack();
        else startTrack();
      });

      function fillTrackModeOptions() {
        const options = [{ value: 'auto', text: '⚙︎ Automatisch — volgt de snelheid' }].concat(
          trackingProfiles().map(profile => ({
            value: profile.id,
