    :root {
      color-scheme: light dark;
      --bg: #f2f2f7;
      --panel: #ffffff;
      --panel-2: #f7f7fa;
      --border: #d8d8dd;
      --text: #111114;
      --muted: #6e6e73;
      --accent: #0a84ff;
      --accent-soft: rgba(10,132,255,.14);
      --danger: #ff3b30;
      --warn: #ff9500;
      --shadow: 0 8px 28px rgba(0,0,0,.14);
      --r: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --split: 62%;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --panel: #1c1c1e;
        --panel-2: #2c2c2e;
        --border: #3a3a3c;
        --text: #f2f2f7;
        --muted: #9b9ba1;
        --accent-soft: rgba(10,132,255,.22);
        --shadow: 0 8px 28px rgba(0,0,0,.55);
      }
    }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app { position: relative; height: 100dvh; overflow: hidden; }

    /* ---------- toolbar ---------- */
    .toolbar {
      position: absolute;
      top: calc(8px + var(--safe-top));
      right: 8px;
      z-index: 1500;
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    body.modal-visible .toolbar { display: none; }

    .btn {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      font-weight: 600;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease;
    }
    .btn:active { transform: scale(.94); }
    .btn:disabled { opacity: .45; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.icon { width: 44px; min-width: 44px; padding: 0; font-size: 20px; line-height: 1; }

    /* record button */
    .btn.record { display: grid; place-items: center; }
    .btn.record::before {
      content: "";
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--danger);
      transition: border-radius .2s ease, width .2s ease, height .2s ease;
    }
    .btn.record.recording { border-color: var(--danger); background: rgba(255,59,48,.12); }
    .btn.record.recording::before { width: 14px; height: 14px; border-radius: 3px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    /* ---------- layout ---------- */
    .workspace {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: var(--split) minmax(0, 1fr);
      overflow: hidden;
    }
    #map { min-height: 0; width: 100%; height: 100%; background: #dcdce1; }

    .list-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      background: var(--panel);
      border-top: 1px solid var(--border);
      box-shadow: 0 -6px 18px rgba(0,0,0,.06);
    }

    .grabber {
      display: grid;
      place-items: center;
      height: 22px;
      border: 0;
      width: 100%;
      padding: 0;
      background: transparent;
      cursor: ns-resize;
      touch-action: none;
    }
    .grabber span { width: 42px; height: 5px; border-radius: 3px; background: var(--border); }
    .grabber:active span { background: var(--accent); }

    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px 6px;
    }
    .count { font-size: 12px; font-weight: 700; color: var(--muted); }
    .head-actions { display: flex; gap: 6px; }
    .head-actions .btn { display: grid; place-items: center; min-height: 36px; width: 40px; min-width: 40px; padding: 0; border-radius: 10px; color: var(--muted); }
    .head-actions .btn:active { color: var(--accent); }

    .items {
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 0 8px calc(10px + var(--safe-bottom));
      scroll-padding: 12px;
    }
    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 20px;
      font-size: 13px;
      line-height: 1.5;
    }

    .item {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      padding: 8px 9px;
      margin-bottom: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      scroll-margin: 12px;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .item-main { min-width: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .item:active { transform: scale(.995); }
    .item-title {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 700;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .item-address, .item-note, .item-time {
      margin-top: 2px;
      font-size: 11.5px;
      line-height: 1.3;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .item-actions { display: flex; gap: 6px; align-items: center; }
    .item-kind {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-right: 5px;
      font-size: 10px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .item.active-track { border-color: rgba(255,59,48,.5); box-shadow: inset 3px 0 0 var(--danger); }
    .item.active-track .item-kind { color: var(--danger); }
    .item.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    /* with no checkbox left, a bar plus a tick carry the selected state */
    .item.selected::before {
      content: "";
      position: absolute;
      left: 0; top: 10px; bottom: 10px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
    }
    .item.selected .item-title::after {
      content: " ✓";
      color: var(--accent);
      font-weight: 900;
    }

    /* group headings in the list */
    .group-head {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 2px;
      margin: 8px 0 5px;
      padding: 3px 0;
      background: var(--panel);
    }
    .group-head:first-child { margin-top: 0; }
    .group-chevron, .group-select {
      display: flex;
      align-items: center;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 6px 2px;
    }
    .group-chevron { flex: none; width: 26px; justify-content: center; color: var(--muted); }
    .group-chevron svg { transition: transform .15s ease; transform: rotate(90deg); }
    .group-head.collapsed .group-chevron svg { transform: rotate(0deg); }
    .group-select { flex: 1; min-width: 0; gap: 7px; }
    .group-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
    .group-name {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .group-count { font-size: 10.5px; font-weight: 700; color: var(--muted); flex: none; }
    .group-rule { flex: 1; height: 1px; background: var(--border); }
    .group-head.all-selected .group-name,
    .group-head.all-selected .group-count { color: var(--accent); }
    .group-head.collapsed .group-rule { opacity: .5; }

    .item-cat {
      display: inline-block;
      margin-right: 6px;
      padding: 0 5px;
      border-radius: 5px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 9.5px;
      font-weight: 800;
      line-height: 15px;
      text-transform: uppercase;
      letter-spacing: .03em;
      vertical-align: 1px;
    }

    .mini {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 11px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .mini:active { transform: scale(.94); }
    .mini.delete { color: var(--danger); }
    .mini.toggle { display: grid; place-items: center; color: var(--muted); }
    .mini.toggle .tick { opacity: 0; transition: opacity .12s ease; }
    .item.selected .mini.toggle { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .item.selected .mini.toggle .tick { opacity: 1; }

    /* share/clear only appear while something is selected */
    .head-actions .btn[hidden] { display: none; }
    .head-actions .btn.accent { color: var(--accent); border-color: var(--accent); }
    .count.has-selection { color: var(--accent); }

    .sheet-head-actions { display: flex; gap: 6px; align-items: center; }
    .btn.icon.danger { color: var(--danger); }
    .btn.icon.danger[hidden] { display: none; }

    .choose-options { display: grid; gap: 7px; }
    .choose-options .btn { min-height: 50px; text-align: left; padding: 0 12px; }
    .choose-options .btn small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
    .choose-options .btn.primary small { color: rgba(255,255,255,.88); }

    /* ---------- map markers ---------- */
    .wp-marker { background: transparent; border: 0; }
    /* while a selection is active, everything outside it steps back */
    .wp-marker.dim { opacity: .32; }

    .wp-pin svg { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
    .wp-pin svg path { fill: var(--accent); stroke: #fff; stroke-width: 1.4; }
    .wp-pin svg circle { fill: #fff; }
    .wp-pin.sel svg { filter: drop-shadow(0 0 6px rgba(255,149,0,.95)); transform: scale(1.18); transform-origin: 50% 100%; }
    .wp-pin.sel svg path { fill: var(--warn); }

    /* zoomed out, position is all that matters */
    .wp-dot i {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
    .wp-dot.sel i { background: var(--warn); box-shadow: 0 0 7px rgba(255,149,0,.95); transform: scale(1.35); }

    /* a title starting with an emoji carries it as the marker */
    .wp-emoji .chip {
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #fff;
      border: 2px solid var(--accent);
      box-shadow: 0 2px 4px rgba(0,0,0,.35);
      line-height: 1;
      white-space: nowrap;
    }
    .wp-emoji .chip::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--accent);
    }
    .wp-emoji.sel .chip {
      border-color: var(--warn);
      box-shadow: 0 0 7px rgba(255,149,0,.95);
      transform: scale(1.15);
    }
    .wp-emoji.sel .chip::after { border-top-color: var(--warn); }

    /* ---------- modals ---------- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.4);
      padding: 6px 6px calc(6px + var(--safe-bottom));
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    .modal.open { display: flex; }
    .sheet {
      width: min(100%, 540px);
      max-height: calc(100dvh - 10px - var(--safe-top) - var(--safe-bottom));
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: var(--panel);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .sheet-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      min-height: 48px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .sheet-title { font-weight: 800; font-size: 16px; }

    .form { padding: 8px; }
    .field { margin-bottom: 7px; }
    label { display: block; margin: 0 0 3px 2px; font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
    select {
      width: 100%;
      min-height: 42px;
      padding: 8px 34px 8px 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel-2) no-repeat right 12px center;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-size: 5px 5px, 5px 5px;
      background-position: right 16px center, right 11px center;
      font-size: 16px;
      line-height: 1.2;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    input, textarea {
      width: 100%;
      min-width: 0; /* datetime-local has a wide intrinsic size and would clip its column */
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel-2);
      min-height: 42px;
      padding: 8px 10px;
      font-size: 16px; /* keeps iOS from zooming on focus */
      line-height: 1.2;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    textarea { min-height: 52px; max-height: 100px; resize: vertical; }

    .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
    .row2 > .field { min-width: 0; }
    .address-row { display: grid; grid-template-columns: minmax(0,1fr) 42px; gap: 5px; }
    .coord-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 42px 42px; gap: 5px; align-items: end; }
    .coord-row input { min-width: 0; }
    .search-row { display: grid; grid-template-columns: minmax(0,1fr) 42px 42px; gap: 5px; margin-bottom: 6px; }
    .search-row .btn, .coord-row .btn, .address-row .btn { min-height: 42px; width: 42px; padding: 0; font-size: 17px; }

    .search-results {
      display: grid;
      gap: 4px;
      max-height: 150px;
      overflow: auto;
      margin: 0 0 6px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel-2);
    }
    .search-results[hidden] { display: none; }
    .search-result {
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-radius: 9px;
      background: var(--panel);
      text-align: left;
      font-size: 12.5px;
      line-height: 1.3;
      cursor: pointer;
    }
    .search-result:active { background: var(--accent-soft); }
    .hint { margin-top: 4px; font-size: 10.5px; line-height: 1.35; color: var(--muted); }
    .hint[hidden] { display: none; }

    /* ---------- occasions (repeat visits to one waypoint) ---------- */
    .occasions { display: grid; gap: 6px; }
    .occasion {
      padding: 5px 7px 7px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel-2);
    }
    .occasion-head { display: flex; align-items: center; justify-content: space-between; min-height: 30px; }
    .occasion-num { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .occasion .row2 { gap: 5px; }
    .occasion .field { margin-bottom: 0; min-width: 0; }
    .occasion label { font-size: 9.5px; }
    .occasion input { min-height: 38px; background: var(--panel); }
    .occasion .mini { width: 32px; height: 32px; font-size: 14px; }
    .occasion .mini[hidden] { display: none; }
    .btn.add-occasion {
      width: 100%;
      margin-top: 6px;
      min-height: 40px;
      font-size: 13px;
      color: var(--accent);
      border-style: dashed;
      background: transparent;
    }

    .modal-map { height: 150px; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; margin-bottom: 7px; background: #dcdce1; }

    .track-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 10px; }
    .stat { min-width: 0; padding: 9px 6px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel-2); text-align: center; }
    .stat strong { display: block; font-size: 15px; }
    .stat span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .04em; }
    .warning {
      margin-bottom: 9px;
      padding: 9px 10px;
      border-radius: 10px;
      background: rgba(255,149,0,.14);
      color: var(--warn);
      font-size: 11.5px;
      line-height: 1.4;
    }
    .warning[hidden] { display: none; }

    .form-actions {
      position: sticky;
      bottom: -8px;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
      padding: 8px 0 4px;
      background: var(--panel);
    }
    .form-actions .btn { min-height: 46px; padding: 0 4px; }
    /* the waypoint sheet carries a fourth action (Maps) */
    #waypointForm .form-actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    #waypointForm .form-actions .btn { font-size: 14px; }
    .btn.with-icon { display: inline-flex; align-items: center; justify-content: center; gap: 4px; }

    /* ---------- toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(14px + var(--safe-bottom));
      transform: translate(-50%, 24px);
      z-index: 4000;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 24px);
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(28,28,30,.95);
      color: #fff;
      font-size: 13px;
      line-height: 1.3;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast button {
      flex: none;
      border: 0;
      background: transparent;
      color: #4da3ff;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 2px;
      cursor: pointer;
    }
    .toast button[hidden] { display: none; }

    .leaflet-control-attribution { font-size: 9px; }
    .leaflet-popup-content { margin: 10px 12px; font-size: 12.5px; line-height: 1.35; }
    .leaflet-container { font-family: inherit; }
    .leaflet-bar a { width: 34px; height: 34px; line-height: 34px; }

    /* ---------- wide screens ---------- */
    @media (min-width: 760px) {
      .workspace { grid-template-rows: 1fr; grid-template-columns: minmax(0, 1.7fr) minmax(320px, .7fr); }
      .list-panel { border-top: 0; border-left: 1px solid var(--border); box-shadow: none; }
      .grabber { display: none; }
      .list-head { padding-top: 10px; }
      .modal { align-items: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="toolbar" aria-label="Kaartacties">
      <input id="importFile" type="file" accept=".json,.gpx,application/json,application/gpx+xml,application/xml,text/xml" hidden />
      <button id="refreshBtn" class="btn icon" aria-label="Ververs app" title="Ververs app">&#8635;</button>
      <button id="importBtn" class="btn icon" aria-label="Importeer JSON" title="Importeer JSON">&#128229;</button>
      <button id="exportBtn" class="btn icon" aria-label="Exporteer JSON" title="Exporteer JSON">&#128228;</button>
      <button id="recordBtn" class="btn icon record" aria-label="Start track" title="Start track"></button>
      <button id="addBtn" class="btn icon primary" aria-label="Waypoint toevoegen" title="Waypoint toevoegen">&#128205;</button>
    </nav>

    <section class="workspace">
      <div id="map" aria-label="Kaart met waypoints"></div>

      <aside class="list-panel">
        <button id="grabber" class="grabber" aria-label="Sleep om de kaart te vergroten of te verkleinen"><span></span></button>
        <div class="list-head">
          <div id="count" class="count">0 items</div>
          <div class="head-actions">
            <button id="shareSelBtn" class="btn icon accent" type="button" hidden aria-label="Deel selectie" title="Deel selectie">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 16V3M12 3 8 7M12 3l4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
              </svg>
            </button>
            <button id="clearSelBtn" class="btn icon" type="button" hidden aria-label="Selectie wissen" title="Selectie wissen">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18"/>
              </svg>
            </button>
            <button id="layersBtn" class="btn icon" type="button" aria-label="Kies kaartlaag" title="Kaartlaag">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3 3 8l9 5 9-5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/>
              </svg>
            </button>
            <button id="fitBtn" class="btn icon" type="button" aria-label="Toon alles op de kaart" title="Toon alles">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9V4h5M21 9V4h-5M3 15v5h5M21 15v5h-5"/><circle cx="12" cy="12" r="2.5"/>
              </svg>
            </button>
            <button id="locateBtn" class="btn icon" type="button" aria-label="Ga naar mijn locatie" title="Mijn locatie">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="items" class="items"></div>
      </aside>
    </section>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="sheet">
      <div class="sheet-head">
        <div id="modalTitle" class="sheet-title">Waypoint</div>
        <div class="sheet-head-actions">
          <button id="deleteBtn" class="btn icon danger" type="button" hidden aria-label="Waypoint verwijderen" title="Verwijderen">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v6M14 11v6"/>
            </svg>
          </button>
          <button id="closeBtn" class="btn icon" type="button" aria-label="Sluiten">&times;</button>
        </div>
      </div>

      <form id="waypointForm" class="form">
        <input id="id" type="hidden" />

        <div class="field">
          <label for="title">Titel</label>
          <input id="title" maxlength="100" placeholder="Naam waypoint" required />
        </div>

        <div class="row2">
          <div class="field">
            <label for="category">Categorie</label>
            <input id="category" list="categoryOptions" maxlength="60" placeholder="bv. horeca" />
          </div>
          <div class="field">
            <label for="group">Groep</label>
            <input id="group" list="groupOptions" maxlength="60" placeholder="bv. Dagtrip Dijon" />
          </div>
        </div>
        <div class="hint">Items met dezelfde groep krijgen een kop in de lijst en worden op de kaart met een stippellijn verbonden.</div>

        <div class="field">
          <label for="note">Notitie</label>
          <textarea id="note" maxlength="1000" placeholder="Optionele notitie"></textarea>
        </div>

        <div class="field">
          <label>Bezoeken</label>
          <div id="occasions" class="occasions"></div>
          <button id="addOccasionBtn" class="btn add-occasion" type="button">+ Bezoek toevoegen</button>
          <div class="hint">Eén waypoint, meerdere bezoeken: voeg per bezoek een start- en eindmoment toe.</div>
        </div>

        <div class="field">
          <label for="lat">Co&ouml;rdinaten</label>
          <div class="coord-row">
            <input id="lat" inputmode="decimal" aria-label="Latitude" placeholder="Latitude" required />
            <input id="lng" inputmode="decimal" aria-label="Longitude" placeholder="Longitude" required />
            <button id="coordApplyBtn" class="btn icon" type="button" aria-label="Zet pin op deze co&ouml;rdinaten" title="Zet pin op co&ouml;rdinaten">&#128205;</button>
            <button id="coordPasteBtn" class="btn icon" type="button" aria-label="Lees co&ouml;rdinaten van klembord" title="Plak locatie">&#128203;</button>
          </div>
        </div>

        <div class="search-row">
          <input id="placeSearch" type="search" enterkeyhint="search" autocomplete="street-address" placeholder="Adres, Plus Code of ///what3words" aria-label="Zoek adres, Plus Code of what3words" />
          <button id="placeSearchBtn" class="btn icon" type="button" aria-label="Zoeken" title="Zoeken">&#128269;</button>
          <button id="modalLocateBtn" class="btn icon" type="button" aria-label="Gebruik huidige GPS-locatie" title="Huidige locatie">&#9678;</button>
        </div>
        <div id="searchResults" class="search-results" hidden></div>
        <div id="searchStatus" class="hint" hidden></div>

        <div id="modalMap" class="modal-map" aria-label="Sleep de pin om het waypoint te verplaatsen"></div>

        <div class="field">
          <label for="address">Adres</label>
          <div class="address-row">
            <input id="address" placeholder="Adres wordt automatisch bepaald" />
            <button id="resolveBtn" class="btn icon" type="button" aria-label="Adres opnieuw bepalen" title="Adres opnieuw bepalen">&#8635;</button>
          </div>
        </div>

        <div class="form-actions">
          <button id="cancelBtn" class="btn" type="button">Annuleer</button>
          <button id="waypointShareBtnBottom" class="btn" type="button">&#8599; Deel</button>
          <button id="waypointMapsBtn" class="btn with-icon" type="button" aria-label="Open deze positie in Google Maps">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>Maps
          </button>
          <button class="btn primary" type="submit">Bewaar</button>
        </div>
      </form>
    </section>
  </div>

  <div id="trackModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="trackModalTitle">
    <section class="sheet">
      <div class="sheet-head">
        <div id="trackModalTitle" class="sheet-title">Track</div>
        <div class="sheet-head-actions">
          <button id="trackDeleteBtn" class="btn icon danger" type="button" hidden aria-label="Track verwijderen" title="Verwijderen">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v6M14 11v6"/>
            </svg>
          </button>
          <button id="trackCloseBtn" class="btn icon" type="button" aria-label="Sluiten">&times;</button>
        </div>
      </div>
      <form id="trackForm" class="form">
        <input id="trackId" type="hidden" />
        <div id="trackWarning" class="warning" hidden></div>
        <div class="track-stats">
          <div class="stat"><strong id="trackDistance">0 m</strong><span>AFSTAND</span></div>
          <div class="stat"><strong id="trackDuration">0:00</strong><span>DUUR</span></div>
          <div class="stat"><strong id="trackPoints">0</strong><span>GPS-PUNTEN</span></div>
        </div>
        <div class="field">
          <label for="trackTitle">Titel</label>
          <input id="trackTitle" maxlength="100" placeholder="Opgenomen track" required />
        </div>
        <div class="field">
          <label for="trackMode">Tracking</label>
          <select id="trackMode"></select>
          <div id="trackModeHint" class="hint"></div>
        </div>

        <div class="row2">
          <div class="field">
            <label for="trackCategory">Categorie</label>
            <input id="trackCategory" list="categoryOptions" maxlength="60" placeholder="bv. gebeurtenis" />
          </div>
          <div class="field">
            <label for="trackGroup">Groep</label>
            <input id="trackGroup" list="groupOptions" maxlength="60" placeholder="bv. Dagtrip Dijon" />
          </div>
        </div>

        <div class="field">
          <label for="trackNote">Notitie</label>
          <textarea id="trackNote" maxlength="1000" placeholder="Optionele notitie"></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label for="trackStartAt">Start</label>
            <input id="trackStartAt" type="datetime-local" required />
          </div>
          <div class="field">
            <label for="trackEndAt">Einde</label>
            <input id="trackEndAt" type="datetime-local" required />
          </div>
        </div>
        <div class="form-actions">
          <button id="trackCancelBtn" class="btn" type="button">Annuleer</button>
          <button id="trackShareBtn" class="btn" type="button">&#8599; Deel</button>
          <button class="btn primary" type="submit">Bewaar</button>
        </div>
      </form>
    </section>
  </div>

  <datalist id="categoryOptions"></datalist>
  <datalist id="groupOptions"></datalist>

  <div id="chooseModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="chooseTitle">
    <section class="sheet">
      <div class="sheet-head">
        <div id="chooseTitle" class="sheet-title">Delen</div>
        <button id="chooseCloseBtn" class="btn icon" type="button" aria-label="Sluiten">&times;</button>
      </div>
      <div class="form">
        <div id="chooseHint" class="hint" hidden></div>
        <div id="chooseOptions" class="choose-options"></div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="toastAction" type="button" hidden></button>
  </div>

/**
  Convert locations to and from short codes.

  Open Location Codes are short, 10-11 character codes that can be used instead
  of street addresses. The codes can be generated and decoded offline, and use
  a reduced character set that minimises the chance of codes including words.

  Codes are able to be shortened relative to a nearby location. This means that
  in many cases, only four to seven characters of the code are needed.
  To recover the original code, the same location is not required, as long as
  a nearby location is provided.

  Codes represent rectangular areas rather than points, and the longer the
  code, the smaller the area. A 10 character code represents a 13.5x13.5
  meter area (at the equator. An 11 character code represents approximately
  a 2.8x3.5 meter area.

  characters, one for latitude and one for latitude, using base 20. Each pair
  reduces the area of the code by a factor of 400. Only even code lengths are
  sensible, since an odd-numbered length would have sides in a ratio of 20:1.

  At position 11, the algorithm changes so that each character selects one
  position from a 4x5 grid. This allows single-character refinements.

  Examples:
  
  var OpenLocationCode = require('open-location-code').OpenLocationCode;
	var openLocationCode = new OpenLocationCode();
  
  // Encode a location, default accuracy:
	var code = openLocationCode.encode(47.365590, 8.524997);
	console.log(code);
  
  // Encode a location using one stage of additional refinement:
  code = openLocationCode.encode(47.365590, 8.524997, 11);
  console.log(code);
  
  //Decode a full code:
	var coord = openLocationCode.decode(code);
  var msg = 'Center is ' + coord.latitudeCenter + ',' + coord.longitudeCenter;
	console.log(msg);

	var shortCode = openLocationCode.shorten('8FVC9G8F+6X', 47.5, 8.5);
	console.log(shortCode);

  var nearestCode = openLocationCode.recoverNearest('9G8F+6X', 47.4, 8.6);
	console.log(nearestCode);

            'horeca', 'tankstation', 'kort verblijf', 'lang verblijf',
            'korte pauze', 'parkeren', 'gebeurtenis'
          ]
        }
      };

      // Diep samenvoegen, zodat een override alleen hoeft te noemen wat
      // afwijkt. Arrays worden in hun geheel vervangen.
      function mergeConfig(base, override) {
        if (!override || typeof override !== 'object' || Array.isArray(override)) return base;
        const result = Array.isArray(base) ? [...base] : { ...base };
        for (const [key, value] of Object.entries(override)) {
          result[key] = value && typeof value === 'object' && !Array.isArray(value)
            ? mergeConfig(base?.[key] ?? {}, value)
            : value;
        }
        return result;
      }

      const CONFIG = (() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY + DEFAULT_CONFIG.storage.suffixes.config);
          return raw ? mergeConfig(DEFAULT_CONFIG, JSON.parse(raw)) : DEFAULT_CONFIG;
        } catch {
          return DEFAULT_CONFIG;   // een kapotte override mag niets breken
        }
      })();

      const storageKey = (name) => CONFIG.storage.key + CONFIG.storage.suffixes[name];

      const SPLIT_KEY = storageKey('split');
      const COLLAPSED_KEY = storageKey('collapsedGroups');
      const BASEMAP_KEY = storageKey('basemap');
      const HINT_KEY = storageKey('hintSeen');
      const REFRESH_QUERY_KEY = CONFIG.storage.refreshQueryKey;
      const W3W_API_KEY_KEY = storageKey('what3wordsKey');

      const UNDO_WINDOW_MS = CONFIG.storage.undoWindowMs;

      const DEFAULT_CENTER = CONFIG.map.defaultCenter;
      const DEFAULT_ZOOM = CONFIG.map.defaultZoom;
      const SPLIT_PRESETS = CONFIG.ui.splitPresets;

      const $ = (id) => document.getElementById(id);
      const els = {};
      for (const id of [
        'items', 'count', 'modal', 'waypointForm', 'modalTitle', 'id', 'title', 'note',
        'category', 'group', 'categoryOptions', 'groupOptions', 'deleteBtn', 'trackDeleteBtn',
        'shareSelBtn', 'clearSelBtn', 'layersBtn', 'chooseModal', 'chooseTitle', 'chooseOptions', 'chooseHint', 'chooseCloseBtn',
        'occasions', 'addOccasionBtn', 'lat', 'lng', 'address', 'addBtn', 'importBtn', 'importFile',
        'exportBtn', 'recordBtn', 'refreshBtn', 'modalLocateBtn', 'coordApplyBtn',
        'coordPasteBtn', 'placeSearch', 'placeSearchBtn', 'searchResults', 'searchStatus',
        'waypointShareBtnBottom', 'waypointMapsBtn', 'trackShareBtn', 'modalMap', 'trackModal', 'trackForm',
        'trackModalTitle', 'trackId', 'trackTitle', 'trackNote', 'trackStartAt', 'trackEndAt',
        'trackCategory', 'trackGroup', 'trackMode', 'trackModeHint',
        'trackDistance', 'trackDuration', 'trackPoints', 'trackWarning', 'trackCloseBtn',
        'trackCancelBtn', 'closeBtn', 'cancelBtn', 'resolveBtn', 'toast', 'toastText',
        'toastAction', 'grabber', 'fitBtn', 'locateBtn'
      ]) els[id] = $(id);
      els.form = els.waypointForm;
      els.importInput = els.importFile;

      /* ------------------------------------------------------------------ *
       * State - every mutable binding is declared. A missing declaration is
       * a ReferenceError under strict mode and used to abort render/import.
       * ------------------------------------------------------------------ */
      let items = [];
      let activeTrack = null;
      const selection = new Set();    // ids of every activated item

      const markers = new Map();      // id -> { marker, sig }
      const trackLayers = new Map();  // id -> { group, sig }
      const groupLines = new Map();   // group name -> dotted connector polyline
      let activeTrackLayer = null;
      let activeTrackSegment = null;
      let locationMarker = null;

      let trackingTimer = null;
      let trackingBusy = false;
      let trackingProfile = null;      // actief snelheidsprofiel
      let currentIntervalMs = 0;       // actief bemonsteringsinterval
      let smoothedSpeedKmh = 0;        // afgevlakte snelheid (EMA)
      let coordinateChangeTimer = null;
      let lastResolvedCoords = null;
      let waypointFormBaseline = '';
      let trackFormBaseline = '';
      let modalMap = null;
      let modalMapMarker = null;
      let lastKnownPosition = null;
      let lastItemInteractionAt = 0;
      let autoFollowPausedUntil = 0;
      let lastUsedGroup = '';   // pre-fills the next waypoint of the same trip
      let locationWatchId = null;
      let pendingUndo = null;

      /* ------------------------------------------------------------------ *
       * Storage - never drop local data without an explicit user action
       * ------------------------------------------------------------------ */
      /* ------------------------------------------------------------------ *
       * Opslag
       *
       * Alle reisgegevens staan in IndexedDB; localStorage bewaart alleen
       * instellingen. Trackpunten liggen in een eigen store met sleutel
       * [trackId, volgnummer], zodat een nieuw punt tijdens een opname één
       * kleine append is in plaats van een herschrijving van de hele track.
       * Bij 5000 punten scheelt dat het verschil tussen ~25 ms en <1 ms per
       * punt, en het houdt de opslag ver onder de limiet van localStorage.
       * ------------------------------------------------------------------ */
      function readJson(key) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }

      function writeJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch {
          return false;   // instellingen zijn niet kritiek genoeg voor een melding
        }
      }

      let db = null;

      function openDatabase() {
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) return reject(new Error('IndexedDB is niet beschikbaar'));
          const request = indexedDB.open(CONFIG.storage.dbName, CONFIG.storage.dbVersion);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains(CONFIG.storage.itemStore)) {
              database.createObjectStore(CONFIG.storage.itemStore, { keyPath: 'id' });
            }
            if (!database.objectStoreNames.contains(CONFIG.storage.pointStore)) {
              // Samengestelde sleutel: punten van één track liggen aaneengesloten
              // en komen in de opgenomen volgorde terug.
              database.createObjectStore(CONFIG.storage.pointStore, { keyPath: ['trackId', 'seq'] });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function tx(stores, mode) {
        const transaction = db.transaction(stores, mode);
        return {
          transaction,
          store: (name) => transaction.objectStore(name),
          done: new Promise((resolve, reject) => {
            transaction.oncomplete = resolve;
            transaction.onerror = () => reject(transaction.error);
            transaction.onabort = () => reject(transaction.error);
          })
        };
      }

      const requestResult = (request) => new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      function reportStorageError(error) {
        console.error('Opslagfout', error);
        const full = /quota|exceeded|full/i.test(String(error?.name) + String(error?.message));
        toast(full
          ? 'Opslag is vol. Exporteer en verwijder oude tracks.'
          : 'Opslaan is mislukt. Exporteer je gegevens voor de zekerheid.');
      }

      // Een item-record bevat geen punten; die staan in de puntenstore.
      const itemRecord = (item) => {
        const { points, ...rest } = item;
        return isTrack(item) ? { ...rest, pointCount: points?.length || 0 } : rest;
      };

      const pointRecord = (trackId, point, seq) => ({ ...point, trackId: String(trackId), seq });

      async function loadEverything() {
        const read = tx([CONFIG.storage.itemStore, CONFIG.storage.pointStore], 'readonly');
        const [records, points] = await Promise.all([
          requestResult(read.store(CONFIG.storage.itemStore).getAll()),
          requestResult(read.store(CONFIG.storage.pointStore).getAll())
        ]);
        await read.done;

        const byTrack = new Map();
        for (const point of points) {
          if (!byTrack.has(point.trackId)) byTrack.set(point.trackId, []);
          byTrack.get(point.trackId).push(point);
        }
        for (const list of byTrack.values()) list.sort((a, b) => a.seq - b.seq);

        const restored = records.map(record => {
          if (record.type !== 'track') return record;
          const list = (byTrack.get(String(record.id)) || []).map(({ trackId, seq, ...point }) => point);
          return { ...record, points: list };
        });

        // De invoegvolgorde ligt vast in seq, want IndexedDB geeft op sleutel terug.
        restored.sort((a, b) => (b.seq || 0) - (a.seq || 0));
        nextSeq = restored.reduce((max, item) => Math.max(max, item.seq || 0), 0) + 1;

        return {
          items: restored.filter(item => !item.active),
          activeTrack: restored.find(item => item.active) || null
        };
      }

      // Volgnummer voor de lijstvolgorde: nieuwste bovenaan, net als voorheen.
      let nextSeq = 1;
      const withSeq = (item) => (item.seq ? item : { ...item, seq: nextSeq++ });

      async function persistItem(item) {
        try {
          const write = tx([CONFIG.storage.itemStore], 'readwrite');
          write.store(CONFIG.storage.itemStore).put(itemRecord(item));
          await write.done;
          return true;
        } catch (error) {
          reportStorageError(error);
          return false;
        }
      }

      async function persistPoints(trackId, points) {
        try {
          const write = tx([CONFIG.storage.pointStore], 'readwrite');
          const store = write.store(CONFIG.storage.pointStore);
          points.forEach((point, index) => store.put(pointRecord(trackId, point, index)));
          await write.done;
          return true;
        } catch (error) {
          reportStorageError(error);
          return false;
        }
      }

      // Eén punt toevoegen tijdens een opname: dit is de hete route.
      async function appendPointToDb(trackId, point, seq) {
        try {
          const write = tx([CONFIG.storage.pointStore], 'readwrite');
          write.store(CONFIG.storage.pointStore).put(pointRecord(trackId, point, seq));
          await write.done;
          return true;
        } catch (error) {
          reportStorageError(error);
          return false;
        }
      }

      async function removeItemFromDb(id) {
        try {
          const write = tx([CONFIG.storage.itemStore, CONFIG.storage.pointStore], 'readwrite');
          write.store(CONFIG.storage.itemStore).delete(String(id));
          write.store(CONFIG.storage.pointStore).delete(
            IDBKeyRange.bound([String(id), 0], [String(id), Number.MAX_SAFE_INTEGER]));
          await write.done;
          return true;
        } catch (error) {
          reportStorageError(error);
          return false;
        }
      }

      // Alles vervangen: gebruikt bij import-vervangen en bij ongedaan maken.
      async function replaceAll(list, active = null) {
        try {
          const write = tx([CONFIG.storage.itemStore, CONFIG.storage.pointStore], 'readwrite');
          const itemStore = write.store(CONFIG.storage.itemStore);
          const pointStore = write.store(CONFIG.storage.pointStore);
          itemStore.clear();
          pointStore.clear();
          for (const item of [...list, ...(active ? [active] : [])]) {
            itemStore.put(itemRecord(item));
            if (isTrack(item)) {
              (item.points || []).forEach((point, index) => pointStore.put(pointRecord(item.id, point, index)));
            }
          }
          await write.done;
          return true;
        } catch (error) {
          reportStorageError(error);
          return false;
        }
      }

      // Meerdere items in één transactie: gebruikt bij import-samenvoegen.
      async function persistMany(list) {
        try {
          const write = tx([CONFIG.storage.itemStore, CONFIG.storage.pointStore], 'readwrite');
          const itemStore = write.store(CONFIG.storage.itemStore);
          const pointStore = write.store(CONFIG.storage.pointStore);
          for (const raw of list) {
            const item = withSeq(raw);
            itemStore.put(itemRecord(item));
            if (isTrack(item)) {
              pointStore.delete(IDBKeyRange.bound([String(item.id), 0], [String(item.id), Number.MAX_SAFE_INTEGER]));
              (item.points || []).forEach((point, index) => pointStore.put(pointRecord(item.id, point, index)));
            }
          }
          await write.done;
          return true;
        } catch (error) {
          reportStorageError(error);
          return false;
        }
      }

      function snapshot() {
        return {
          items: items.map(item => structuredClone(item)),
          activeTrack: activeTrack ? structuredClone(activeTrack) : null
        };
      }

      // Bewaart de volledige lijst. Alleen gebruiken waar de hele set wijzigt;
      // losse wijzigingen gaan via persistItem.
      function saveItems() {
        void replaceAll(items, activeTrack);
        return true;
      }

      function saveActiveTrack() {
        if (!activeTrack) return;
        activeTrack = withSeq(activeTrack);
        void persistItem(activeTrack);
      }

      function validTrackSnapshot(value) {
        return Boolean(value) && value.type === 'track' && Array.isArray(value.points);
      }
      /* ------------------------------------------------------------------ *
       * Small helpers
       * ------------------------------------------------------------------ */
      const isTrack = (item) => Boolean(item) && item.type === 'track' && Array.isArray(item.points);
      const toRadians = (value) => value * Math.PI / 180;

      function distanceMetres(a, b) {
        const R = 6371000;
        const dLat = toRadians(b.lat - a.lat);
        const dLng = toRadians(b.lng - a.lng);
        const h = Math.sin(dLat / 2) ** 2 +
          Math.cos(toRadians(a.lat)) * Math.cos(toRadians(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      }

      function uuid() {
        return (crypto.randomUUID && crypto.randomUUID()) ||
          'wp-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      }

      function escapeHtml(value = '') {
        return String(value).replace(/[&<>"']/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[ch]));
      }

      function localDateTimeValue(date = new Date()) {
        const pad = n => String(n).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      const dateTimeFormat = new Intl.DateTimeFormat(undefined, { dateStyle: 'short', timeStyle: 'short' });
      function formatDateTime(value) {
        if (!value) return '';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : dateTimeFormat.format(date);
      }

      const dateOnlyFormat = new Intl.DateTimeFormat(undefined, { dateStyle: 'short' });
      const timeOnlyFormat = new Intl.DateTimeFormat(undefined, { timeStyle: 'short' });

      /**
       * "30/07/2026, 17:30 → 30/07/2026, 17:38" repeats the date for no reason.
       * A range inside one day prints the date once; a range across days keeps
       * both, since then the second date is the information.
       */
      function formatRange(startAt, endAt) {
        if (!startAt) return endAt ? formatDateTime(endAt) : '';
        if (!endAt) return formatDateTime(startAt);
        const start = new Date(startAt);
        const end = new Date(endAt);
        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) {
          return `${formatDateTime(startAt)} → ${formatDateTime(endAt)}`;
        }
        const sameDay = start.getFullYear() === end.getFullYear() &&
          start.getMonth() === end.getMonth() &&
          start.getDate() === end.getDate();
        return sameDay
          ? `${dateOnlyFormat.format(start)} ${timeOnlyFormat.format(start)} → ${timeOnlyFormat.format(end)}`
          : `${formatDateTime(start)} → ${formatDateTime(end)}`;
      }

      const formatDistance = (metres) =>
        metres >= 1000 ? `${(metres / 1000).toFixed(2)} km` : `${Math.round(metres)} m`;

      function formatDuration(ms) {
        const total = Math.floor(ms / 1000);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        return hours
          ? `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
          : `${minutes}:${String(seconds).padStart(2, '0')}`;
      }

      /* ------------------------------------------------------------------ *
       * Occasions: one waypoint can be visited on several separate moments.
       * `occasions` is authoritative; `startAt`/`endAt` stay on the item as a
       * mirror of the overall span so older exports and v7 keep working.
       * ------------------------------------------------------------------ */
      function itemOccasions(item) {
        const source = Array.isArray(item.occasions) && item.occasions.length
          ? item.occasions
          : [{ startAt: item.startAt, endAt: item.endAt }];
        return source
          .map(occasion => ({
            startAt: occasion?.startAt ? String(occasion.startAt) : '',
            endAt: occasion?.endAt ? String(occasion.endAt) : ''
          }))
          .filter(occasion => occasion.startAt);
      }

      // datetime-local values are fixed-width and zero padded, so a plain
      // string compare is already chronological.
      const sortOccasions = (list) =>
        [...list].sort((a, b) => a.startAt.localeCompare(b.startAt));

      const occasionText = (occasion) => formatRange(occasion.startAt, occasion.endAt);

      function occasionsSummary(item) {
        const list = sortOccasions(itemOccasions(item));
        if (!list.length) return '';
        if (list.length === 1) return occasionText(list[0]);
        const last = list.at(-1);
        return `${list.length}× bezocht · ${formatRange(list[0].startAt, last.endAt || last.startAt)}`;
      }

      function overlappingOccasions(list) {
        const sorted = sortOccasions(list);
        for (let i = 1; i < sorted.length; i++) {
          if (sorted[i].startAt < (sorted[i - 1].endAt || sorted[i - 1].startAt)) return true;
        }
        return false;
      }

      // The span that older readers see in startAt/endAt.
      function occasionSpan(list) {
        const sorted = sortOccasions(list);
        const last = sorted.at(-1);
        return {
          startAt: sorted[0].startAt,
          endAt: sorted.length === 1 ? sorted[0].endAt : (last.endAt || last.startAt)
        };
      }

      const validCoords = (lat, lng) =>
        Number.isFinite(lat) && Number.isFinite(lng) &&
        lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;

      function readCoords() {
        return {
          lat: Number.parseFloat(String(els.lat.value).replace(',', '.')),
          lng: Number.parseFloat(String(els.lng.value).replace(',', '.'))
        };
      }

      function setCoords(lat, lng) {
        els.lat.value = Number(lat).toFixed(6);
        els.lng.value = Number(lng).toFixed(6);
      }

      let toastTimer = 0;
      function toast(message, actionLabel = '', action = null) {
        els.toastText.textContent = message;
        els.toastAction.hidden = !actionLabel;
        els.toastAction.textContent = actionLabel;
        els.toastAction.onclick = actionLabel && action
          ? () => { hideToast(); action(); }
          : null;
        els.toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, actionLabel ? UNDO_WINDOW_MS : CONFIG.ui.toastMs);
      }

      function hideToast() {
        clearTimeout(toastTimer);
        els.toast.classList.remove('show');
        els.toastAction.hidden = true;
        els.toastAction.onclick = null;
      }

      function offerUndo(message, before) {
        pendingUndo = before;
        toast(message, 'Ongedaan maken', () => {
          if (!pendingUndo) return;
          items = pendingUndo.items;
          if (pendingUndo.activeTrack && !activeTrack) {
            activeTrack = pendingUndo.activeTrack;
            saveActiveTrack();
          }
          pendingUndo = null;
          void replaceAll(items, activeTrack).then(() => toast('Hersteld.'));
          render();
        });
      }

      /* ------------------------------------------------------------------ *
       * Map
       * ------------------------------------------------------------------ */
      const map = L.map('map', {
        zoomControl: false,
        attributionControl: true,
        preferCanvas: true,
        tap: true,
        zoomSnap: CONFIG.map.zoomSnap,
        maxBoundsViscosity: 0.8
      }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);

      L.control.zoom({ position: 'bottomleft' }).addTo(map);

      /* ------------------------------------------------------------------ *
       * Basemaps. All are key-free and send CORS headers, which the PNG
       * export depends on; `credit` is the attribution burned into that PNG.
       * ------------------------------------------------------------------ */
      const BASEMAPS = {
        osm: {
          name: 'Standaard', detail: 'OpenStreetMap',
          url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
          subdomains: 'abc', maxZoom: 19,
          attribution: '&copy; OpenStreetMap',
          credit: '© OpenStreetMap contributors'
        },
        light: {
          name: 'Licht', detail: 'Rustige kaart, veel contrast met de pins',
          url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
          subdomains: 'abcd', maxZoom: 20,
          attribution: '&copy; OpenStreetMap, &copy; CARTO',
          credit: '© OpenStreetMap contributors, © CARTO'
        },
        dark: {
          name: 'Donker', detail: 'Donkere kaart voor s nachts',
          url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
          subdomains: 'abcd', maxZoom: 20,
          attribution: '&copy; OpenStreetMap, &copy; CARTO',
          credit: '© OpenStreetMap contributors, © CARTO'
        },
        satellite: {
          name: 'Satelliet', detail: 'Luchtfoto (Esri World Imagery)',
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          subdomains: '', maxZoom: 19,
          attribution: 'Tiles &copy; Esri',
          credit: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'
        },
        terrain: {
          name: 'Terrein', detail: 'Hoogtelijnen en reliëf (OpenTopoMap)',
          url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
          subdomains: 'abc', maxZoom: 17,
          attribution: '&copy; OpenStreetMap, SRTM | &copy; OpenTopoMap (CC-BY-SA)',
          credit: '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)'
        }
      };

      let basemapKey = BASEMAPS[localStorage.getItem(BASEMAP_KEY)] ? localStorage.getItem(BASEMAP_KEY) : 'osm';
      const basemap = () => BASEMAPS[basemapKey];

      function createTileLayer(extra = {}) {
        const config = basemap();
        const options = {
          maxZoom: config.maxZoom,
          crossOrigin: true,
          updateWhenIdle: true,
          keepBuffer: 3,
          attribution: config.attribution,
          ...extra
        };
        // Leaflet resolves {s} for every tile even when the template has no
        // placeholder, so the key is omitted rather than set to undefined,
        // which would shadow its default and throw on each tile.
        if (config.subdomains) options.subdomains = config.subdomains;
        return L.tileLayer(config.url, options);
      }

      let baseLayer = createTileLayer().addTo(map);
      let modalBaseLayer = null;

      function applyBasemap(key) {
        if (!BASEMAPS[key] || key === basemapKey) return;
        basemapKey = key;
        try { localStorage.setItem(BASEMAP_KEY, key); } catch {}
        map.removeLayer(baseLayer);
        baseLayer = createTileLayer().addTo(map);
        if (modalMap && modalBaseLayer) {
          modalMap.removeLayer(modalBaseLayer);
          modalBaseLayer = createTileLayer({ keepBuffer: 1 }).addTo(modalMap);
        }
        // Zoom levels differ per source; never leave the map past the maximum.
        if (map.getZoom() > basemap().maxZoom) map.setZoom(basemap().maxZoom);
        toast(`Kaartlaag: ${basemap().name}.`);
      }

      const trackRenderer = L.canvas({ tolerance: CONFIG.map.canvasTolerance, padding: 0.4 });

      const TRACK_STYLE = { color: CONFIG.tracks.colorSaved, weight: CONFIG.tracks.weights[0].weight, opacity: CONFIG.tracks.opacitySaved, renderer: trackRenderer };
      const ACTIVE_TRACK_STYLE = { color: CONFIG.tracks.colorActive, weight: CONFIG.tracks.weights[0].weight + 1, opacity: CONFIG.tracks.opacityActive, renderer: trackRenderer };

      const pinSvg = (w, h) =>
        `<svg viewBox="0 0 26 34" width="${w}" height="${h}" aria-hidden="true">` +
        '<path d="M13 33S24 20.8 24 13A11 11 0 1 0 2 13c0 7.8 11 20 11 20z"/>' +
        '<circle cx="13" cy="12.6" r="4.2"/></svg>';

      /* ------------------------------------------------------------------ *
       * Marker scale by zoom
       *
       * At country scale a field of full-size pins collapses into one blob,
       * so markers step down to plain dots. Thresholds are chosen around what
       * the zoom level means: street/town detail keeps the full pin, regional
       * views get a compact pin, and from country scale down only position
       * matters, so a dot carries it.
       * ------------------------------------------------------------------ */
      const MARKER_TIERS = CONFIG.markers.tiers;
      const TRACK_WEIGHTS = CONFIG.tracks.weights;
      const tierFor = (zoom) => MARKER_TIERS.find(tier => zoom >= tier.minZoom) || MARKER_TIERS.at(-1);
      const stepFor = (zoom) => TRACK_WEIGHTS.find(step => zoom >= step.minZoom) || TRACK_WEIGHTS.at(-1);
      const weightFor = (zoom) => stepFor(zoom).weight;

      let markerTier = tierFor(map.getZoom());
      let trackStep = stepFor(map.getZoom());
      let trackWeight = trackStep.weight;
      const trackScale = () => trackWeight / TRACK_STYLE.weight;

      // A title that opens with an emoji says more than a generic pin, so the
      // emoji becomes the marker. Grapheme segmentation keeps flags and other
      // multi-codepoint sequences intact; the regex is the fallback.
      const EMOJI_RE = /^(?:\p{Regional_Indicator}\p{Regional_Indicator}|\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}|\p{Emoji_Modifier})*)/u;
      const segmenter = typeof Intl !== 'undefined' && Intl.Segmenter
        ? new Intl.Segmenter(undefined, { granularity: 'grapheme' })
        : null;

      // Returns the leading emoji plus how many glyphs it is, so a pair such
      // as a border crossing's two flags gets a wider badge instead of being
      // clipped by a circle sized for one.
      function leadingEmoji(title) {
        const text = String(title || '').trim();
        if (!text) return { emoji: '', units: 0 };
        if (segmenter) {
          let found = '';
          let units = 0;
          for (const { segment } of segmenter.segment(text)) {
            if (!EMOJI_RE.test(segment) || units >= 2) break;
            found += segment;
            units++;
          }
          return { emoji: found, units };
        }
        const match = text.match(EMOJI_RE);
        return match ? { emoji: match[0], units: 1 } : { emoji: '', units: 0 };
      }

      // When the emoji is drawn as the marker, repeating it in the title right
      // next to it says nothing twice.
      function titleWithoutIcon(item) {
        const { emoji } = leadingEmoji(item.title);
        if (!emoji) return item.title;
        const rest = String(item.title).trim().slice(emoji.length).trim();
        return rest || item.title;   // a title that is only an emoji keeps it
      }

      function iconFor(item, tier = markerTier) {
        const { emoji, units } = leadingEmoji(item.title);
        if (tier.kind === 'dot') {
          const size = tier.size;
          return L.divIcon({
            html: '<i></i>',
            className: 'wp-marker wp-dot',
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2],
            popupAnchor: [0, -size / 2 - 2]
          });
        }
        const [w, h] = tier.size;
        if (emoji) {
          const chip = Math.round(tier.emoji * 1.75);
          const width = units > 1 ? Math.round(chip * 1.5) : chip;
          return L.divIcon({
            html: `<span class="chip" style="width:${width}px;height:${chip}px;font-size:${tier.emoji}px">${escapeHtml(emoji)}</span>`,
            className: 'wp-marker wp-emoji',
            iconSize: [width, chip + 7],
            iconAnchor: [width / 2, chip + 7],
            popupAnchor: [0, -chip - 4]
          });
        }
        return L.divIcon({
          html: pinSvg(w, h),
          className: 'wp-marker wp-pin',
          iconSize: [w, h],
          iconAnchor: [w / 2, h],
          popupAnchor: [0, -h + 4]
        });
      }

      function applyZoomScale() {
        const zoom = map.getZoom();
        const tier = tierFor(zoom);
        const step = stepFor(zoom);
        if (tier === markerTier && step === trackStep) return;
        markerTier = tier;
        trackStep = step;
        trackWeight = step.weight;

        markers.forEach((entry, id) => {
          const item = findItem(id);
          if (!item) return;
          entry.marker.setIcon(iconFor(item, tier));
          // The icon may have gained or lost the emoji, so the popup title
          // follows it rather than repeating what the marker already shows.
          entry.marker.setPopupContent(popupHtml(item));
        });
        trackLayers.forEach(entry => entry.group.eachLayer(layer =>
          layer.setStyle && layer.setStyle({ weight: step.weight })));
        if (activeTrackLayer) activeTrackLayer.eachLayer(layer =>
          layer.setStyle && layer.setStyle({ weight: step.weight + 1 }));
        groupLines.forEach(entry => entry.line.setStyle({ weight: step.connector, dashArray: step.dash }));
        applySelectionStyles();   // setIcon replaces the element, so restyle
      }

      // Marker graphics rise above their coordinate, and the toolbar floats over
      // the top of the map, so framing is padded in pixels rather than degrees.
      // The toolbar grows with the safe-area inset on notched phones, so its
      // real height is measured instead of assumed.
      const PIN_HEIGHT = CONFIG.markers.pinHeight;
      const toolbarEl = document.querySelector('.toolbar');
      function fitPadding() {
        const mapTop = map.getContainer().getBoundingClientRect().top;
        const bar = toolbarEl?.getBoundingClientRect();
        // The pin's tip is the coordinate, so clearing the toolbar means
        // reserving the toolbar height plus the icon above it.
        const wanted = bar && bar.height
          ? Math.ceil(bar.bottom - mapTop) + PIN_HEIGHT + 6
          : PIN_HEIGHT + 14;
        // A short map pane would otherwise be almost all padding.
        const top = Math.min(Math.round(map.getSize().y * CONFIG.map.fitPaddingTopShare), Math.max(PIN_HEIGHT + 14, wanted));
        return { paddingTopLeft: [CONFIG.map.fitPaddingX, top], paddingBottomRight: [CONFIG.map.fitPaddingX, CONFIG.map.fitPaddingBottom] };
      }


      function pauseAutoFollow(milliseconds = CONFIG.map.autoFollowPauseMs) {
        autoFollowPausedUntil = Math.max(autoFollowPausedUntil, Date.now() + milliseconds);
      }

      /* ------------------------------------------------------------------ *
       * Track geometry
       * ------------------------------------------------------------------ */
      function splitTrackSegments(track) {
        const segments = [];
        let current = [];
        const points = (track.points || []).filter(p => validCoords(Number(p.lat), Number(p.lng)));
        points.forEach((point, index) => {
          const previous = points[index - 1];
          const timedGap = previous && new Date(point.time) - new Date(previous.time) > CONFIG.tracking.gapThresholdMs;
          if (index === 0 || point.breakBefore || timedGap) {
            if (current.length) segments.push(current);
            current = [];
          }
          current.push([Number(point.lat), Number(point.lng)]);
        });
        if (current.length) segments.push(current);
        return segments;
      }

      function trackStats(track) {
        const points = track.points || [];
        let distance = 0;
        let gaps = 0;
        for (let i = 1; i < points.length; i++) {
          const gap = points[i].breakBefore ||
            new Date(points[i].time) - new Date(points[i - 1].time) > CONFIG.tracking.gapThresholdMs;
          if (gap) gaps++;
          else distance += distanceMetres(points[i - 1], points[i]);
        }
        const start = new Date(track.startAt || track.createdAt || Date.now());
        const end = new Date(track.endAt || Date.now());
        return { distance, durationMs: Math.max(0, end - start), points: points.length, gaps };
      }

      function trackSummary(track) {
        const stats = trackStats(track);
        // Bij een lopende opname staat vooraan welk profiel nu geldt, zodat
        // zichtbaar is hoe fijn er wordt vastgelegd.
        const profile = track.active ? profileById(track.profile) : null;
        const prefix = profile
          ? `${profile.icon} ${profile.label} (${profile.minMoveM} m) · `
          : '';
        return prefix + `${formatDistance(stats.distance)} · ${formatDuration(stats.durationMs)} · ${stats.points} punten` +
          (stats.gaps ? ` · ${stats.gaps} onderbreking${stats.gaps === 1 ? '' : 'en'}` : '');
      }

      const scaledWeight = (style) => Math.max(1, Math.round(style.weight * trackScale()));

      function buildTrackGroup(track, style) {
        const group = L.featureGroup();
        const weight = scaledWeight(style);
        splitTrackSegments(track).forEach(segment => {
          if (segment.length > 1) L.polyline(segment, { ...style, weight }).addTo(group);
          else L.circleMarker(segment[0], { ...style, weight, radius: Math.max(2, weight), fillOpacity: .9 }).addTo(group);
        });
        group.on('click', event => {
          // Pass the Leaflet event, not the DOM event: only this form sets the
          // _stopped flag that keeps the map's own click handler from running
          // straight afterwards and clearing the selection again.
          L.DomEvent.stopPropagation(event);
          selectItem(track.id, { fromMap: true });
        });
        return group;
      }

      /* ------------------------------------------------------------------ *
       * Rendering - the list and the map layers are updated independently so
       * a GPS tick never rebuilds the whole DOM.
       * ------------------------------------------------------------------ */
      function itemSignature(item) {
        if (isTrack(item)) return `t|${item.points.length}|${item.updatedAt || ''}|${item.active ? 1 : 0}`;
        const occasions = itemOccasions(item).map(o => `${o.startAt}~${o.endAt}`).join(';');
        return `w|${item.lat}|${item.lng}|${item.title}|${item.address || ''}|${occasions}`;
      }

      function listRow(item) {
        const selected = isSelected(item.id) ? ' selected' : '';
        const chip = item.category ? `<span class="item-cat">${escapeHtml(item.category)}</span>` : '';
        const edit = `<button class="mini" type="button" data-action="edit" aria-label="Bewerken">✎</button>`;

        if (isTrack(item)) {
          const timeText = item.endAt
            ? formatRange(item.startAt, item.endAt)
            : `${formatDateTime(item.startAt)} · opname loopt`;
          return `
            <article class="item${item.active ? ' active-track' : ''}${selected}" data-id="${escapeHtml(item.id)}" data-type="track">
              <div class="item-main" data-action="toggle">
                <div class="item-title"><span class="item-kind">〰</span>${escapeHtml(item.title || 'Opgenomen track')}</div>
                <div class="item-time">${chip}${escapeHtml(timeText)}</div>
                <div class="item-address" data-role="summary">${escapeHtml(trackSummary(item))}</div>
                ${item.note ? `<div class="item-note">${escapeHtml(item.note)}</div>` : ''}
              </div>
              <div class="item-actions">${edit}</div>
            </article>`;
        }

        const timeText = occasionsSummary(item);
        return `
          <article class="item${selected}" data-id="${escapeHtml(item.id)}" data-type="waypoint">
            <div class="item-main" data-action="toggle">
              <div class="item-title">${escapeHtml(item.title)}</div>
              ${chip || timeText ? `<div class="item-time">${chip}${escapeHtml(timeText)}</div>` : ''}
              <div class="item-address">${escapeHtml(item.address || `${Number(item.lat).toFixed(6)}, ${Number(item.lng).toFixed(6)}`)}</div>
              ${item.note ? `<div class="item-note">${escapeHtml(item.note)}</div>` : ''}
            </div>
            <div class="item-actions">${edit}</div>
          </article>`;
      }

      const itemGroup = (item) => String(item?.group || '').trim();

      // Chronological within a group: the list order and the dotted connector
      // on the map then tell the same story.
      const itemMoment = (item) => {
        const first = sortOccasions(itemOccasions(item))[0];
        return first?.startAt || item.startAt || item.createdAt || '';
      };

      // A stable colour per group name, so list dot and map line match.
      function groupColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 360;
        return `hsl(${hash}, 68%, 45%)`;
      }

      function groupedSections() {
        const groups = new Map();
        const ungrouped = [];
        for (const item of items) {
          const name = itemGroup(item);
          if (!name) { ungrouped.push(item); continue; }
          if (!groups.has(name)) groups.set(name, []);
          groups.get(name).push(item);
        }
        const sections = [...groups.entries()]
          .map(([name, members]) => ({
            name,
            items: [...members].sort((a, b) => itemMoment(a).localeCompare(itemMoment(b)))
          }))
          .sort((a, b) => itemMoment(a.items[0]).localeCompare(itemMoment(b.items[0])));
        if (ungrouped.length) sections.push({ name: '', items: ungrouped });
        return sections;
      }

      const collapsedGroups = new Set(readJson(COLLAPSED_KEY) || []);
      const isCollapsed = (name) => collapsedGroups.has(name || '');

      function setCollapsed(name, collapsed) {
        collapsed ? collapsedGroups.add(name || '') : collapsedGroups.delete(name || '');
        writeJson(COLLAPSED_KEY, [...collapsedGroups]);
      }

      function groupHeadHtml(section) {
        const { name, items: members } = section;
        const collapsed = isCollapsed(name);
        const allSelected = members.length > 0 && members.every(member => isSelected(member.id));
        const selectedCount = members.filter(member => isSelected(member.id)).length;
        return `
          <div class="group-head${allSelected ? ' all-selected' : ''}${collapsed ? ' collapsed' : ''}" data-group="${escapeHtml(name)}">
            <button class="group-chevron" type="button" data-action="collapse"
              aria-label="${collapsed ? 'Groep uitklappen' : 'Groep inklappen'}" aria-expanded="${!collapsed}">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 6l6 6-6 6"/>
              </svg>
            </button>
            <button class="group-select" type="button" data-action="select-group"
              aria-label="Alles in ${escapeHtml(name || 'deze groep')} selecteren">
              <span class="group-dot" style="background:${name ? groupColor(name) : 'var(--muted)'}"></span>
              <span class="group-name">${escapeHtml(name || 'Zonder groep')}</span>
              <span class="group-rule"></span>
              <span class="group-count">${selectedCount ? `${selectedCount}/${members.length}` : members.length}</span>
            </button>
          </div>`;
      }

      function renderList() {
        const total = (activeTrack ? 1 : 0) + items.length;
        if (!total) {
          els.items.innerHTML = '<div class="empty">Nog niets opgeslagen.<br>Tik op \u{1F4CD} voor een waypoint, houd de kaart ingedrukt voor een waypoint op die plek, of start een track met de rode knop.</div>';
          return;
        }

        const head = activeTrack ? listRow(activeTrack) : '';
        const sections = groupedSections();
        // Only switch to headed sections once groups are actually in use.
        const useGroups = sections.some(section => section.name);
        els.items.innerHTML = head + (useGroups
          ? sections.map(section => groupHeadHtml(section) +
              (isCollapsed(section.name) ? '' : section.items.map(listRow).join(''))).join('')
          : items.map(listRow).join(''));
      }

      function popupHtml(item) {
        const visits = sortOccasions(itemOccasions(item));
        const showsEmoji = markerTier.kind === 'pin' && leadingEmoji(item.title).emoji;
        const title = showsEmoji ? titleWithoutIcon(item) : item.title;
        return `<strong>${escapeHtml(title)}</strong><br>` +
          visits.slice(0, 3).map(occasion => `${escapeHtml(occasionText(occasion))}<br>`).join('') +
          (visits.length > 3 ? `<em>+${visits.length - 3} bezoek${visits.length - 3 === 1 ? '' : 'en'}</em><br>` : '') +
          escapeHtml(item.address || `${Number(item.lat).toFixed(5)}, ${Number(item.lng).toFixed(5)}`);
      }

      function syncMapLayers() {
        const liveIds = new Set();

        for (const item of items) {
          const id = String(item.id);
          liveIds.add(id);
          const signature = itemSignature(item);

          if (isTrack(item)) {
            if (markers.has(id)) { map.removeLayer(markers.get(id).marker); markers.delete(id); }
            const existing = trackLayers.get(id);
            if (existing && existing.sig === signature) continue;
            if (existing) map.removeLayer(existing.group);
            const group = buildTrackGroup(item, TRACK_STYLE).addTo(map);
            trackLayers.set(id, { group, sig: signature });
            continue;
          }

          if (trackLayers.has(id)) { map.removeLayer(trackLayers.get(id).group); trackLayers.delete(id); }
          const existing = markers.get(id);
          const popup = popupHtml(item);

          if (existing) {
            if (existing.sig === signature) continue;
            existing.marker.setLatLng([item.lat, item.lng]).setPopupContent(popup);
            existing.sig = signature;
            continue;
          }

          const marker = L.marker([item.lat, item.lng], { icon: iconFor(item), riseOnHover: true })
            .addTo(map)
            .bindPopup(popup);
          marker.on('click', () => selectItem(id, { fromMap: true }));
          markers.set(id, { marker, sig: signature });
        }

        for (const [id, entry] of markers) {
          if (!liveIds.has(id)) { map.removeLayer(entry.marker); markers.delete(id); }
        }
        for (const [id, entry] of trackLayers) {
          if (!liveIds.has(id)) { map.removeLayer(entry.group); trackLayers.delete(id); }
        }

        syncGroupLines();
        syncActiveTrackLayer();
      }

      // Thin dotted connector through the waypoints of one group, in the same
      // chronological order the list shows them.
      function syncGroupLines() {
        const wanted = new Map();
        for (const section of groupedSections()) {
          if (!section.name) continue;
          const points = section.items
            .filter(item => !isTrack(item) && validCoords(Number(item.lat), Number(item.lng)))
            .map(item => [Number(item.lat), Number(item.lng)]);
          if (points.length > 1) wanted.set(section.name, points);
        }

        for (const [name, entry] of groupLines) {
          if (!wanted.has(name)) { map.removeLayer(entry.line); groupLines.delete(name); }
        }

        for (const [name, points] of wanted) {
          const signature = points.map(p => p.join(',')).join('|');
          const existing = groupLines.get(name);
          if (existing?.sig === signature) continue;
          if (existing) map.removeLayer(existing.line);
          const line = L.polyline(points, {
            color: groupColor(name),
            weight: trackStep.connector,
            opacity: CONFIG.tracks.connectorOpacity,
